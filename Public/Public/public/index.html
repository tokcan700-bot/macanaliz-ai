<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MaçAnaliz AI</title>

<style>
:root{
  --bg:#07111f;
  --panel:#0d1b2c;
  --panel2:#101f32;
  --text:#f5f7fb;
  --muted:#91a2b7;
  --green:#19e58c;
  --line:#20334b;
  --gold:#f6c453;
  --red:#ff6376;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#07111f,#091626);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

button{font-family:inherit}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

.top{
  position:sticky;
  top:0;
  z-index:10;
  padding:13px 14px;
  background:rgba(7,17,31,.96);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:18px;
  font-weight:900;
}

.logo b{color:var(--green)}

.live{
  padding:5px 8px;
  border:1px solid #31506e;
  border-radius:999px;
  color:#b8c6d6;
  font-size:9px;
}

.hero{
  padding:18px 14px 12px;
}

.hero.hidden{
  display:none;
}

.hero h1{
  margin:0 0 7px;
  font-size:25px;
}

.hero h1 span{color:var(--green)}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.bar{
  display:flex;
  gap:7px;
  padding:0 14px 12px;
  overflow:auto;
}

.bar button{
  flex:none;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel);
  color:#c8d4e0;
  font-size:11px;
  font-weight:800;
}

.bar button.active{
  background:var(--green);
  color:#06150e;
}

.section{
  padding:0 14px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 0 10px;
}

.section-title h2{
  margin:0;
  font-size:16px;
}

.section-title small{
  color:var(--muted);
  font-size:10px;
}

.card{
  margin-bottom:10px;
  padding:12px;
  background:linear-gradient(145deg,var(--panel),#0b1726);
  border:1px solid var(--line);
  border-radius:14px;
}

.card.live-card{
  border-color:#176844;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10px;
}

.match-date{
  flex:none;
  color:#e3eaf2;
  font-weight:800;
  white-space:nowrap;
}

.league{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.league img{
  width:16px;
  height:16px;
  object-fit:contain;
}

.league span{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.teams{
  display:grid;
  grid-template-columns:1fr 68px 1fr;
  gap:7px;
  align-items:center;
  margin:13px 0;
}

.team{
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.team img{
  display:block;
  width:38px;
  height:38px;
  margin:0 auto 6px;
  object-fit:contain;
}

.score{
  text-align:center;
  font-size:16px;
  font-weight:900;
}

.kickoff-time{
  margin-top:4px;
  color:var(--green);
  font-size:13px;
  font-weight:900;
}

.kickoff-date{
  margin-top:2px;
  color:var(--muted);
  font-size:8px;
}

.minute{
  margin-top:3px;
  color:var(--green);
  font-size:9px;
}

.actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
}

.action-right{
  display:flex;
  align-items:center;
  gap:6px;
}

.status{
  display:inline-block;
  padding:6px 8px;
  border-radius:9px;
  background:#13283d;
  color:#cbd6e1;
  font-size:10px;
}

.status.live-status{
  color:var(--green);
  border:1px solid #176844;
}

.pred-btn,
.detail-btn,
.refresh-btn,
.fav-btn{
  padding:8px 10px;
  border-radius:9px;
  font-size:11px;
  font-weight:900;
}

.pred-btn{
  border:0;
  background:var(--green);
  color:#06150e;
}

.detail-btn{
  background:#152a40;
  color:var(--green);
  border:1px solid #176844;
}

.refresh-btn{
  border:0;
  background:var(--green);
  color:#06150e;
}

.fav-btn{
  width:36px;
  padding:7px 0;
  border:1px solid #40566f;
  background:#10243a;
  color:#9eb0c4;
  font-size:18px;
  line-height:1;
}

.fav-btn.active{
  color:var(--gold);
  border-color:#8b6c24;
  background:#201b0e;
}

.pred-btn:disabled,
.detail-btn:disabled,
.refresh-btn:disabled{
  opacity:.55;
}

.pred{
  display:none;
  margin-top:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#091524;
}

.pred.show{display:block}

.pred-title{
  margin-bottom:8px;
  font-size:12px;
  font-weight:900;
}

.pred-grid,
.model-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.pill,
.model-card{
  padding:7px 4px;
  border-radius:9px;
  background:#12243a;
  text-align:center;
  font-size:9px;
}

.model-card{
  border:1px solid #263b55;
  background:var(--panel2);
}

.pill b,
.model-card strong{
  display:block;
  margin-top:2px;
  color:var(--green);
  font-size:15px;
}

.model{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.model h4{
  margin:0 0 8px;
  color:var(--gold);
  font-size:12px;
}

.conf{
  color:var(--muted);
  font-size:8px;
}

.consensus-box{
  margin-top:9px;
  padding:9px;
  border:1px solid #29445f;
  border-radius:9px;
  background:#10253a;
}

.consensus-title{
  color:var(--gold);
  font-size:9px;
  font-weight:800;
}

.consensus-value{
  margin-top:2px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.consensus-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
}

.analysis-details{
  margin-top:9px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0b1828;
}

.analysis-title{
  margin-bottom:4px;
  color:var(--gold);
  font-size:9px;
  font-weight:900;
}

.analysis-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:5px 0;
  border-bottom:1px solid rgba(145,162,183,.12);
  font-size:9px;
}

.analysis-row:last-child{border-bottom:0}
.analysis-row span{color:var(--muted)}

.source-badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.source-badge{
  padding:4px 6px;
  border:1px solid #28415c;
  border-radius:999px;
  background:#11263a;
  color:#9fb1c6;
  font-size:8px;
}

.source-badge.active{
  color:var(--green);
  border-color:#176844;
}

.source-badge.warn{
  color:var(--gold);
  border-color:#755b25;
}

.note{
  margin-top:8px;
  color:var(--muted);
  font-size:8px;
}

.loading,
.error,
.empty{
  margin:18px 0;
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.error{
  color:#ff98a4;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  padding:8px 9px;
  border-top:1px solid var(--line);
  background:rgba(7,17,31,.97);
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  max-width:760px;
  margin:auto;
}

.nav button{
  border:0;
  background:none;
  color:#7f91a7;
  font-size:9px;
}

.nav button span{
  display:block;
  margin-bottom:2px;
  font-size:18px;
}

.nav button.active{
  color:var(--green);
}


/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(2,8,16,.88);
  backdrop-filter:blur(6px);
}

.modal.show{
  display:block;
}

.modal-sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-width:760px;
  max-height:92vh;
  margin:auto;
  overflow:auto;
  background:#091625;
  border:1px solid #29415d;
  border-bottom:0;
  border-radius:22px 22px 0 0;
  padding:12px 14px 35px;
}

.modal-head{
  position:sticky;
  top:-12px;
  z-index:3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  background:#091625;
}

.modal-title{
  font-size:14px;
  font-weight:900;
}

.modal-actions{
  display:flex;
  gap:6px;
}

.close-btn{
  width:34px;
  height:34px;
  border:1px solid #304a68;
  border-radius:50%;
  background:#10243a;
  color:white;
  font-size:18px;
}

.live-head{
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0d1b2c;
}

.live-league{
  color:var(--muted);
  font-size:9px;
  text-align:center;
}

.live-score{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  gap:8px;
  align-items:center;
  margin-top:12px;
}

.live-team{
  text-align:center;
  font-size:11px;
  font-weight:800;
}

.live-team img{
  display:block;
  width:44px;
  height:44px;
  margin:0 auto 5px;
  object-fit:contain;
}

.live-score-main{
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.live-minute{
  margin-top:3px;
  color:var(--green);
  font-size:10px;
}

.live-meta{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:8px;
  line-height:1.6;
}

.detail-kickoff{
  margin:10px auto 0;
  max-width:260px;
  padding:8px;
  border:1px solid #176844;
  border-radius:10px;
  background:#0b211b;
  color:var(--green);
  text-align:center;
  font-size:10px;
  font-weight:900;
}

.availability{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

.availability-item{
  padding:7px 4px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f2033;
  text-align:center;
  font-size:8px;
  color:var(--muted);
}

.availability-item.ok{
  border-color:#176844;
  color:var(--green);
}

.availability-item.no{
  border-color:#725e28;
  color:var(--gold);
}

.live-section{
  margin-top:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0b1828;
}

.live-section h3{
  margin:0 0 8px;
  color:var(--gold);
  font-size:11px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.summary-card{
  padding:9px 5px;
  border:1px solid #263b55;
  border-radius:10px;
  background:#102033;
  text-align:center;
  font-size:8px;
  color:var(--muted);
}

.summary-card b{
  display:block;
  margin-top:3px;
  color:var(--green);
  font-size:15px;
}

.summary-row{
  margin-top:7px;
  padding:7px;
  border-radius:9px;
  background:#102033;
  font-size:9px;
}

.summary-row span{
  color:var(--muted);
}

.stat-row{
  display:grid;
  grid-template-columns:1fr 115px 1fr;
  gap:6px;
  align-items:center;
  padding:7px 0;
  border-bottom:1px solid rgba(145,162,183,.1);
  font-size:9px;
}

.stat-row:last-child{
  border-bottom:0;
}

.stat-home{
  text-align:right;
  font-weight:800;
}

.stat-name{
  text-align:center;
  color:var(--muted);
  font-size:8px;
}

.stat-away{
  text-align:left;
  font-weight:800;
}

.event{
  display:grid;
  grid-template-columns:38px 1fr;
  gap:7px;
  padding:8px 0;
  border-bottom:1px solid rgba(145,162,183,.1);
}

.event-time{
  color:var(--green);
  font-size:10px;
  font-weight:900;
}

.event-main{
  font-size:9px;
  line-height:1.4;
}

.event-detail{
  color:var(--muted);
  font-size:8px;
}

.no-data{
  color:var(--muted);
  font-size:9px;
  line-height:1.5;
}

.updated-at{
  margin-top:8px;
  text-align:center;
  color:var(--muted);
  font-size:8px;
}
</style>
</head>

<body>

<main class="app">

<header class="top">
  <div class="brand">
    <div class="logo">⚽ MaçAnaliz <b>AI</b></div>
    <div class="live">CANLI VERİ</div>
  </div>
</header>

<section class="hero" id="heroSection">
  <h1>
    Bugünün <span>gerçek maçları</span>
  </h1>

  <p>
    Türkiye tarih ve saatiyle maç programı,
    canlı skor, olaylar ve MaçAnaliz AI tahminleri.
  </p>
</section>

<div class="bar" id="filterBar">
  <button class="active" data-filter="all">Tümü</button>
  <button data-filter="NS">Başlamadı</button>
  <button data-filter="LIVE">Canlı</button>
  <button data-filter="FT">Biten</button>
</div>

<section class="section">

  <div class="section-title">
    <h2>Bugünün Maçları</h2>
    <small id="count">yükleniyor...</small>
  </div>

  <div id="list"></div>

</section>

</main>


<nav class="bottom">

  <div class="nav">

    <button class="active">
      <span>⌂</span>
      Ana Sayfa
    </button>

    <button>
      <span>⚽</span>
      Maçlar
    </button>

    <button>
      <span>▥</span>
      Tahminler
    </button>

    <button>
      <span>☆</span>
      Favoriler
    </button>

  </div>

</nav>


<div class="modal" id="matchModal">

  <div class="modal-sheet">

    <div class="modal-head">

      <div class="modal-title">
        Maç Detayı
      </div>

      <div class="modal-actions">

        <button
          class="refresh-btn"
          id="refreshLiveBtn"
          onclick="refreshLiveDetail()"
        >
          ↻ Yenile
        </button>

        <button
          class="close-btn"
          onclick="closeLiveDetail()"
        >
          ×
        </button>

      </div>

    </div>

    <div id="liveContent">

      <div class="loading">
        Maç detayları yükleniyor...
      </div>

    </div>

  </div>

</div>


<script>

let matches = [];
let activeFilter = "all";
let activeLiveFixture = null;
let activePage = "home";


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function showHero(show){

  const hero =
    document.getElementById(
      "heroSection"
    );

  if(show){
    hero.classList.remove(
      "hidden"
    );
  }else{
    hero.classList.add(
      "hidden"
    );
  }
}


function showFilters(show){

  document.getElementById(
    "filterBar"
  ).style.display =
    show
      ? "flex"
      : "none";
}


function fmtDateTime(iso){

  const d =
    new Date(iso);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return {
      date:"-",
      time:"-"
    };
  }

  const date =
    new Intl.DateTimeFormat(
      "tr-TR",
      {
        timeZone:"Europe/Istanbul",
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    ).format(d);

  const time =
    new Intl.DateTimeFormat(
      "tr-TR",
      {
        timeZone:"Europe/Istanbul",
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    ).format(d);

  return {
    date,
    time
  };
}


function trLeagueText(value){

  const text =
    String(value || "");

  const map = {
    "Friendlies Clubs":
      "Kulüp Hazırlık Maçları",

    "Club Friendlies":
      "Kulüp Hazırlık Maçları",

    "Friendlies":
      "Hazırlık Maçları",

    "International Friendlies":
      "Uluslararası Hazırlık Maçları"
  };

  return map[text] || text;
}


function trRoundText(value){

  const text =
    String(value || "");

  const map = {
    "Club Friendlies":
      "Kulüp Hazırlık Maçı",

    "Friendlies Clubs":
      "Kulüp Hazırlık Maçı",

    "Friendlies":
      "Hazırlık Maçı"
  };

  if(map[text]){
    return map[text];
  }

  return text
    .replace(
      /^Regular Season\s*-?\s*/i,
      "Normal Sezon - "
    )
    .replace(
      /^Group Stage\s*-?\s*/i,
      "Grup Aşaması - "
    )
    .replace(
      /^Round of 16$/i,
      "Son 16"
    )
    .replace(
      /^Quarter-finals$/i,
      "Çeyrek Final"
    )
    .replace(
      /^Semi-finals$/i,
      "Yarı Final"
    )
    .replace(
      /^Final$/i,
      "Final Maçı"
    );
}


function group(status){

  const liveStatuses = [
    "1H",
    "HT",
    "2H",
    "ET",
    "BT",
    "P",
    "LIVE",
    "INT"
  ];

  const finishedStatuses = [
    "FT",
    "AET",
    "PEN"
  ];

  if(
    liveStatuses.includes(
      status
    )
  ){
    return "LIVE";
  }

  if(
    finishedStatuses.includes(
      status
    )
  ){
    return "FT";
  }

  return status;
}


function isLive(status){
  return group(status) === "LIVE";
}


function todayKey(){

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Istanbul",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(new Date());
}


/* FAVORİLER */

const FAVORITES_KEY =
  "macanaliz-favorites-v1";


function getFavorites(){

  try{

    const value =
      JSON.parse(
        localStorage.getItem(
          FAVORITES_KEY
        ) || "[]"
      );

    return Array.isArray(value)
      ? value
      : [];

  }catch{

    return [];
  }
}


function saveFavorites(items){

  localStorage.setItem(
    FAVORITES_KEY,
    JSON.stringify(items)
  );
}


function isFavorite(fixture){

  return getFavorites()
    .some(
      item =>
        Number(item.id) ===
        Number(fixture)
    );
}


function toggleFavorite(fixture){

  let favorites =
    getFavorites();

  const index =
    favorites.findIndex(
      item =>
        Number(item.id) ===
        Number(fixture)
    );

  if(index >= 0){

    favorites.splice(
      index,
      1
    );

  }else{

    const match =
      matches.find(
        item =>
          Number(item.id) ===
          Number(fixture)
      );

    if(!match){
      return;
    }

    favorites.unshift({
      ...match,
      savedAt:
        new Date()
          .toISOString()
    });
  }

  saveFavorites(
    favorites
  );

  if(
    activePage ===
    "favorites"
  ){
    renderFavorites();
  }else{
    render();
  }
}


/* TAHMİN KAYDI */

function trAdvice(text){

  if(!text){
    return "API Tahmini";
  }

  return String(text)
    .replace(
      /^Combo Double chance\s*:\s*/i,
      "Kombine Tahmin: "
    )
    .replace(
      /^Double chance\s*:\s*/i,
      "Çifte Şans: "
    )
    .replace(
      /\bor draw\b/gi,
      "veya Beraberlik"
    )
    .replace(
      /\band\s*\+1\.5 goals\b/gi,
      " + 1.5 Üst"
    )
    .replace(
      /\band\s*\+2\.5 goals\b/gi,
      " + 2.5 Üst"
    )
    .replace(
      /\band\s*-1\.5 goals\b/gi,
      " + 1.5 Alt"
    )
    .replace(
      /\band\s*-2\.5 goals\b/gi,
      " + 2.5 Alt"
    )
    .replace(/\bhome\b/gi,"Ev Sahibi")
    .replace(/\baway\b/gi,"Deplasman")
    .replace(/\bdraw\b/gi,"Beraberlik")
    .replace(/\bor\b/gi,"veya")
    .replace(/\band\b/gi,"+")
    .replace(/\s+/g," ")
    .trim();
}


function strongStorageKey(){

  return (
    "macanaliz-strong-" +
    todayKey()
  );
}


function getStrongPicks(){

  try{

    return JSON.parse(
      localStorage.getItem(
        strongStorageKey()
      ) || "[]"
    );

  }catch{

    return [];
  }
}


function saveStrongPick(
  match,
  prediction,
  model
){

  if(
    !match ||
    !model
  ){
    return;
  }

  const strong =
    model.over15 >= 80 ||
    model.over25 >= 70 ||
    model.btts >= 70;

  if(!strong){
    return;
  }

  const picks =
    getStrongPicks();

  const item = {

    id:
      match.id,

    kickoff:
      match.kickoff,

    league:
      match.league,

    home:
      match.home,

    away:
      match.away,

    advice:
      trAdvice(
        prediction?.advice
      ),

    model:{
      over15:
        model.over15,

      over25:
        model.over25,

      btts:
        model.btts,

      expectedGoals:
        model.expectedGoals,

      dataCount:
        model.dataCount
    }
  };

  const oldIndex =
    picks.findIndex(
      x =>
        Number(x.id) ===
        Number(match.id)
    );

  if(oldIndex >= 0){
    picks[oldIndex] =
      item;
  }else{
    picks.push(item);
  }

  localStorage.setItem(
    strongStorageKey(),
    JSON.stringify(picks)
  );
}

        `/api/prediction?fixture=${fixture}`

      !response.ok ||
      !data.success

      throw new Error(
        data.error ||
        "Tahmin alınamadı."

function showValue(value){

function statRow(

function eventIcon(
  type,
  detail
){

  const t =
    String(type || "")
      .toLowerCase();

  const d =
    String(detail || "")
      .toLowerCase();

  if(
    t.includes("goal")
  ){
    return "⚽";
  }

  if(
    t.includes("card")
  ){

    if(
      d.includes("red")
    ){
      return "🟥";
    }

    return "🟨";
  }

  if(
    t.includes("subst")
  ){
    return "🔄";
  }

  if(
    t.includes("var")
  ){
    return "📺";
  }

  return "•";
}


function trEventDetail(value){

  const text =
    String(value || "");

  const map = {

    "Normal Goal":
      "Gol",

    "Own Goal":
      "Kendi Kalesine Gol",

    "Penalty":
      "Penaltı Golü",

    "Missed Penalty":
      "Kaçan Penaltı",

    "Yellow Card":
      "Sarı Kart",

    "Red Card":
      "Kırmızı Kart",

    "Second Yellow card":
      "İkinci Sarıdan Kırmızı",

    "Goal cancelled":
      "Gol İptal",

    "Penalty confirmed":
      "Penaltı Onaylandı",

    "Var Goal Disallowed":
      "VAR: Gol İptal",

    "Goal Disallowed - offside":
      "Ofsayt Nedeniyle Gol İptal",

    "Goal Disallowed - handball":
      "Elle Oynama Nedeniyle Gol İptal"
  };

  if(map[text]){
    return map[text];
  }

  if(
    /^Substitution\s*\d*$/i.test(
      text
    )
  ){
    return "Oyuncu Değişikliği";
  }

  return text
    .replace(
      /Substitution/gi,
      "Oyuncu Değişikliği"
    )
    .replace(
      /Normal Goal/gi,
      "Gol"
    )
    .replace(
      /Yellow Card/gi,
      "Sarı Kart"
    )
    .replace(
      /Red Card/gi,
      "Kırmızı Kart"
    );
}


function buildEventSummary(events){

  const list =
    Array.isArray(events)
      ? events
      : [];

  const goals =
    list.filter(
      event => {

        const type =
          String(
            event.type || ""
          )
          .toLowerCase();

        const detail =
          String(
            event.detail || ""
          )
          .toLowerCase();

        return (
          type.includes("goal") &&
          !detail.includes("missed") &&
          !detail.includes("cancelled") &&
          !detail.includes("disallowed")
        );
      }
    );


  const yellowCards =
    list.filter(
      event => {

        const type =
          String(
            event.type || ""
          )
          .toLowerCase();

        const detail =
          String(
            event.detail || ""
          )
          .toLowerCase();

        return (
          type.includes("card") &&
          detail.includes("yellow") &&
          !detail.includes("second")
        );
      }
    );


  const redCards =
    list.filter(
      event => {

        const type =
          String(
            event.type || ""
          )
          .toLowerCase();

        const detail =
          String(
            event.detail || ""
          )
          .toLowerCase();

        return (
          type.includes("card") &&
          (
            detail.includes("red") ||
            detail.includes(
              "second yellow"
            )
          )
        );
      }
    );


  const substitutions =
    list.filter(
      event =>
        String(
          event.type || ""
        )
        .toLowerCase()
        .includes("subst")
    );


  const firstGoal =
    goals.length
      ? goals[0]
      : null;


  const lastGoal =
    goals.length
      ? goals[
          goals.length - 1
        ]
      : null;


  const lastEvent =
    list.length
      ? list[
          list.length - 1
        ]
      : null;


  return {

    goals:
      goals.length,

    yellowCards:
      yellowCards.length,

    redCards:
      redCards.length,

    substitutions:
      substitutions.length,

    firstGoal,

    lastGoal,

    lastEvent
  };
}


function eventMinute(event){

  if(
    !event ||
    event.elapsed == null
  ){
    return "-";
  }

  return `${event.elapsed}${
    event.extra
      ? "+" + event.extra
      : ""
  }'`;
}

async function fetchLiveDetail(
  fixture
){

  const root =
    document.getElementById(
      "liveContent"
    );

  const button =
    document.getElementById(
      "refreshLiveBtn"
    );

  button.disabled =
    true;

  button.textContent =
    "Yükleniyor...";


  try{

    const response =
      await fetch(
        `/api/live-detail?fixture=${fixture}&t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){
      throw new Error(
        data.error ||
        "Maç detayı alınamadı."
      );
    }

    renderLiveDetail(
      data
    );

  }catch(error){

    root.innerHTML =
      `
      <div class="error">

        <b>
          Maç detayı alınamadı.
        </b>

        <br><br>

        ${esc(
          error.message ||
          ""
        )}

      </div>
      `;

  }finally{

    button.disabled =
      false;

    button.textContent =
      "↻ Yenile";
  }
}


function openLiveDetail(
  fixture
){

  activeLiveFixture =
    fixture;

  document.getElementById(
    "matchModal"
  ).classList.add(
    "show"
  );

  document.body.style.overflow =
    "hidden";

  document.getElementById(
    "liveContent"
  ).innerHTML =
    `
    <div class="loading">
      Maç detayları yükleniyor...
    </div>
    `;

  fetchLiveDetail(
    fixture
  );
}


function refreshLiveDetail(){

  if(
    activeLiveFixture
  ){

    fetchLiveDetail(
      activeLiveFixture
    );
  }
}


function closeLiveDetail(){

  document.getElementById(
    "matchModal"
  ).classList.remove(
    "show"
  );

  document.body.style.overflow =
    "";

  activeLiveFixture =
    null;
}


document.getElementById(
  "matchModal"
).addEventListener(
  "click",
  event => {

    if(
      event.target.id ===
      "matchModal"
    ){
      closeLiveDetail();
    }
  }
);
