<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MaçAnaliz AI</title>

<style>
:root{
  --bg:#07111f;
  --panel:#0d1b2c;
  --panel2:#101f32;
  --text:#f5f7fb;
  --muted:#91a2b7;
  --green:#19e58c;
  --line:#20334b;
  --gold:#f6c453;
  --red:#ff6376;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#07111f,#091626);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

button{font-family:inherit}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

.top{
  position:sticky;
  top:0;
  z-index:10;
  padding:13px 14px;
  background:rgba(7,17,31,.96);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:18px;
  font-weight:900;
}

.logo b{color:var(--green)}

.live{
  padding:5px 8px;
  border:1px solid #31506e;
  border-radius:999px;
  color:#b8c6d6;
  font-size:9px;
}

.hero{
  padding:18px 14px 12px;
}

.hero h1{
  margin:0 0 7px;
  font-size:25px;
  line-height:1.08;
}

.hero h1 span{color:var(--green)}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.bar{
  display:flex;
  gap:7px;
  padding:0 14px 12px;
  overflow:auto;
}

.bar button{
  flex:none;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel);
  color:#c8d4e0;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.bar button.active{
  background:var(--green);
  color:#06150e;
}

.section{padding:0 14px}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 0 10px;
}

.section-title h2{
  margin:0;
  font-size:16px;
}

.section-title small{
  color:var(--muted);
  font-size:10px;
}

.card{
  margin-bottom:10px;
  padding:12px;
  background:linear-gradient(145deg,var(--panel),#0b1726);
  border:1px solid var(--line);
  border-radius:14px;
}

.card.live-card{
  border-color:#176844;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10px;
}

.match-date{
  flex:none;
  color:#c8d4e0;
  font-weight:700;
  white-space:nowrap;
}

.league{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.league img{
  width:16px;
  height:16px;
  object-fit:contain;
}

.league span{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.teams{
  display:grid;
  grid-template-columns:1fr 60px 1fr;
  gap:7px;
  align-items:center;
  margin:13px 0;
}

.team{
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.team img{
  display:block;
  width:38px;
  height:38px;
  margin:0 auto 6px;
  object-fit:contain;
}

.score{
  text-align:center;
  font-size:16px;
  font-weight:900;
}

.kickoff-time{
  margin-top:4px;
  color:var(--green);
  font-size:11px;
  font-weight:900;
}

.minute{
  margin-top:3px;
  color:var(--green);
  font-size:9px;
}

.actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.status{
  display:inline-block;
  padding:6px 8px;
  border-radius:9px;
  background:#13283d;
  color:#cbd6e1;
  font-size:10px;
}

.status.live-status{
  color:var(--green);
  border:1px solid #176844;
}

.pred-btn,
.detail-btn,
.refresh-btn{
  padding:8px 10px;
  border:0;
  border-radius:9px;
  font-size:11px;
  font-weight:900;
}

.pred-btn{
  background:var(--green);
  color:#06150e;
}

.detail-btn{
  background:#152a40;
  color:var(--green);
  border:1px solid #176844;
}

.refresh-btn{
  background:var(--green);
  color:#06150e;
}

.pred-btn:disabled,
.detail-btn:disabled,
.refresh-btn:disabled{
  opacity:.55;
}

.pred{
  display:none;
  margin-top:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#091524;
}

.pred.show{display:block}

.pred-title{
  margin-bottom:8px;
  font-size:12px;
  font-weight:900;
  line-height:1.4;
}

.pred-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.pill{
  padding:7px 4px;
  border-radius:9px;
  background:#12243a;
  text-align:center;
  font-size:9px;
}

.pill b{
  display:block;
  margin-top:2px;
  color:var(--green);
  font-size:15px;
}

.model{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.model h4{
  margin:0 0 8px;
  color:var(--gold);
  font-size:12px;
}

.model-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.model-card{
  padding:7px 4px;
  border:1px solid #263b55;
  border-radius:9px;
  background:var(--panel2);
  text-align:center;
  font-size:9px;
}

.model-card strong{
  display:block;
  margin:2px 0;
  color:var(--green);
  font-size:16px;
}

.conf{
  color:var(--muted);
  font-size:8px;
}

.consensus-box{
  margin-top:9px;
  padding:9px;
  border:1px solid #29445f;
  border-radius:9px;
  background:linear-gradient(135deg,#0c1d2e,#10253a);
}

.consensus-title{
  color:var(--gold);
  font-size:9px;
  font-weight:800;
}

.consensus-value{
  margin-top:2px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.consensus-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
}

.analysis-details{
  margin-top:9px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0b1828;
}

.analysis-title{
  margin-bottom:4px;
  color:var(--gold);
  font-size:9px;
  font-weight:900;
}

.analysis-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:5px 0;
  border-bottom:1px solid rgba(145,162,183,.12);
  font-size:9px;
}

.analysis-row:last-child{border-bottom:0}

.analysis-row span{color:var(--muted)}

.analysis-row b{
  max-width:64%;
  text-align:right;
}

.source-badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.source-badge{
  padding:4px 6px;
  border:1px solid #28415c;
  border-radius:999px;
  background:#11263a;
  color:#9fb1c6;
  font-size:8px;
}

.source-badge.active{
  color:var(--green);
  border-color:#176844;
}

.source-badge.warn{
  color:var(--gold);
  border-color:#755b25;
}

.note{
  margin-top:8px;
  color:var(--muted);
  font-size:8px;
  line-height:1.5;
}

.loading,
.error,
.empty{
  margin:18px 0;
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.error{color:#ff98a4}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  padding:8px 9px;
  border-top:1px solid var(--line);
  background:rgba(7,17,31,.97);
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  max-width:760px;
  margin:auto;
}

.nav button{
  border:0;
  background:none;
  color:#7f91a7;
  font-size:9px;
}

.nav button span{
  display:block;
  margin-bottom:2px;
  font-size:18px;
}

.nav button.active{color:var(--green)}


/* MAÇ DETAY */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(2,8,16,.88);
  backdrop-filter:blur(6px);
}

.modal.show{display:block}

.modal-sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-width:760px;
  max-height:92vh;
  margin:auto;
  overflow:auto;
  background:#091625;
  border:1px solid #29415d;
  border-bottom:0;
  border-radius:22px 22px 0 0;
  padding:12px 14px 35px;
}

.modal-head{
  position:sticky;
  top:-12px;
  z-index:3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  background:#091625;
}

.modal-title{
  font-size:14px;
  font-weight:900;
}

.modal-actions{
  display:flex;
  gap:6px;
}

.close-btn{
  width:34px;
  height:34px;
  border:1px solid #304a68;
  border-radius:50%;
  background:#10243a;
  color:white;
  font-size:18px;
}

.live-head{
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0d1b2c;
}

.live-league{
  color:var(--muted);
  font-size:9px;
  text-align:center;
}

.live-score{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  gap:8px;
  align-items:center;
  margin-top:12px;
}

.live-team{
  text-align:center;
  font-size:11px;
  font-weight:800;
}

.live-team img{
  display:block;
  width:44px;
  height:44px;
  margin:0 auto 5px;
  object-fit:contain;
}

.live-score-main{
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.live-minute{
  margin-top:3px;
  color:var(--green);
  font-size:10px;
}

.live-meta{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:8px;
  line-height:1.5;
}

.availability{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

.availability-item{
  padding:7px 4px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f2033;
  text-align:center;
  font-size:8px;
  color:var(--muted);
}

.availability-item.ok{
  border-color:#176844;
  color:var(--green);
}

.availability-item.no{
  border-color:#725e28;
  color:var(--gold);
}

.live-section{
  margin-top:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0b1828;
}

.live-section h3{
  margin:0 0 8px;
  color:var(--gold);
  font-size:11px;
}

.stat-row{
  display:grid;
  grid-template-columns:1fr 115px 1fr;
  gap:6px;
  align-items:center;
  padding:7px 0;
  border-bottom:1px solid rgba(145,162,183,.1);
  font-size:9px;
}

.stat-row:last-child{border-bottom:0}

.stat-home{text-align:right;font-weight:800}
.stat-name{text-align:center;color:var(--muted);font-size:8px}
.stat-away{text-align:left;font-weight:800}

.event{
  display:grid;
  grid-template-columns:38px 1fr;
  gap:7px;
  padding:8px 0;
  border-bottom:1px solid rgba(145,162,183,.1);
}

.event-time{
  color:var(--green);
  font-size:10px;
  font-weight:900;
}

.event-main{
  font-size:9px;
  line-height:1.4;
}

.event-detail{
  color:var(--muted);
  font-size:8px;
}

.no-data{
  color:var(--muted);
  font-size:9px;
  line-height:1.5;
}

.updated-at{
  margin-top:8px;
  text-align:center;
  color:var(--muted);
  font-size:8px;
}
</style>
</head>

<body>

<main class="app">

<header class="top">
  <div class="brand">
    <div class="logo">⚽ MaçAnaliz <b>AI</b></div>
    <div class="live">CANLI VERİ</div>
  </div>
</header>

<section class="hero">
  <h1>Bugünün <span>gerçek maçları</span></h1>
  <p>
    Türkiye tarih ve saatiyle maç programı,
    canlı skor, maç olayları ve MaçAnaliz AI tahminleri.
  </p>
</section>

<div class="bar">
  <button class="active" data-filter="all">Tümü</button>
  <button data-filter="NS">Başlamadı</button>
  <button data-filter="LIVE">Canlı</button>
  <button data-filter="FT">Biten</button>
</div>

<section class="section">
  <div class="section-title">
    <h2>Bugünün Maçları</h2>
    <small id="count">yükleniyor...</small>
  </div>

  <div id="list"></div>
</section>

</main>


<nav class="bottom">
  <div class="nav">
    <button class="active"><span>⌂</span>Ana Sayfa</button>
    <button><span>⚽</span>Maçlar</button>
    <button><span>▥</span>Tahminler</button>
    <button><span>☆</span>Favoriler</button>
  </div>
</nav>


<div class="modal" id="matchModal">

  <div class="modal-sheet">

    <div class="modal-head">

      <div class="modal-title">
        Maç Detayı
      </div>

      <div class="modal-actions">

        <button
          class="refresh-btn"
          id="refreshLiveBtn"
          onclick="refreshLiveDetail()"
        >
          ↻ Yenile
        </button>

        <button
          class="close-btn"
          onclick="closeLiveDetail()"
        >
          ×
        </button>

      </div>

    </div>

    <div id="liveContent">
      <div class="loading">
        Maç detayları yükleniyor...
      </div>
    </div>

  </div>

</div>


<script>

let matches = [];
let activeFilter = "all";
let activeLiveFixture = null;


/* GÜVENLİ HTML */

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* TÜRKİYE TARİH + SAAT */

function fmtDateTime(iso){

  const dateObject =
    new Date(iso);

  if(
    Number.isNaN(
      dateObject.getTime()
    )
  ){
    return {
      date:"-",
      time:"-"
    };
  }

  const date =
    new Intl.DateTimeFormat(
      "tr-TR",
      {
        timeZone:"Europe/Istanbul",
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    ).format(dateObject);

  const time =
    new Intl.DateTimeFormat(
      "tr-TR",
      {
        timeZone:"Europe/Istanbul",
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
      }
    ).format(dateObject);

  return {
    date,
    time
  };
}


function group(status){

  const liveStatuses = [
    "1H","HT","2H","ET",
    "BT","P","LIVE","INT"
  ];

  const finishedStatuses = [
    "FT","AET","PEN"
  ];

  if(
    liveStatuses.includes(status)
  ){
    return "LIVE";
  }

  if(
    finishedStatuses.includes(status)
  ){
    return "FT";
  }

  return status;
}


function isLive(status){
  return group(status) === "LIVE";
}


function todayKey(){

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Istanbul",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(new Date());
}


function trAdvice(text){

  if(!text){
    return "API Tahmini";
  }

  return String(text)

    .replace(
      /^Combo Double chance\s*:\s*/i,
      "Kombine Tahmin: "
    )

    .replace(
      /^Double chance\s*:\s*/i,
      "Çifte Şans: "
    )

    .replace(
      /\bor draw\b/gi,
      "veya Beraberlik"
    )

    .replace(
      /\band\s*\+1\.5 goals\b/gi,
      " + 1.5 Üst"
    )

    .replace(
      /\band\s*\+2\.5 goals\b/gi,
      " + 2.5 Üst"
    )

    .replace(
      /\band\s*-1\.5 goals\b/gi,
      " + 1.5 Alt"
    )

    .replace(
      /\band\s*-2\.5 goals\b/gi,
      " + 2.5 Alt"
    )

    .replace(/\bhome\b/gi,"Ev Sahibi")
    .replace(/\baway\b/gi,"Deplasman")
    .replace(/\bdraw\b/gi,"Beraberlik")
    .replace(/\bor\b/gi,"veya")
    .replace(/\band\b/gi,"+")
    .replace(/\s+/g," ")
    .trim();
}


function strongStorageKey(){
  return "macanaliz-strong-" + todayKey();
}


function getStrongPicks(){

  try{
    return JSON.parse(
      localStorage.getItem(
        strongStorageKey()
      ) || "[]"
    );
  }catch{
    return [];
  }
}


function saveStrongPick(match,prediction,model){

  if(
    !match ||
    !model
  ){
    return;
  }

  const strong =
    model.over15 >= 80 ||
    model.over25 >= 70 ||
    model.btts >= 70;

  if(!strong){
    return;
  }

  const picks =
    getStrongPicks();

  const item = {
    id:match.id,
    kickoff:match.kickoff,
    league:match.league,
    home:match.home,
    away:match.away,
    advice:trAdvice(prediction?.advice),
    model:{
      over15:model.over15,
      over25:model.over25,
      btts:model.btts,
      expectedGoals:model.expectedGoals,
      dataCount:model.dataCount
    }
  };

  const index =
    picks.findIndex(
      x =>
        Number(x.id) ===
        Number(match.id)
    );

  if(index >= 0){
    picks[index] = item;
  }else{
    picks.push(item);
  }

  localStorage.setItem(
    strongStorageKey(),
    JSON.stringify(picks)
  );
}


/* MAÇ LİSTESİ */

function render(){

  const root =
    document.getElementById("list");

  document.querySelector(
    ".section-title h2"
  ).textContent =
    "Bugünün Maçları";

  const filtered =
    matches.filter(
      match =>
        activeFilter === "all" ||
        group(match.status) === activeFilter
    );

  document.getElementById(
    "count"
  ).textContent =
    filtered.length + " maç";

  if(!filtered.length){

    root.innerHTML =
      `
      <div class="empty">
        Bu filtrede maç bulunamadı.
      </div>
      `;

    return;
  }

  root.innerHTML =
    filtered.map(
      match => {

        const live =
          isLive(match.status);

        const dt =
          fmtDateTime(
            match.kickoff
          );

        const minute =
          match.elapsed
            ? `${match.elapsed}'`
            : "";

        return `
        <article
          class="card ${
            live
              ? "live-card"
              : ""
          }"
        >

          <div class="meta">

            <div class="league">

              ${
                match.league?.logo
                  ? `
                    <img
                      src="${esc(match.league.logo)}"
                      alt=""
                    >
                  `
                  : ""
              }

              <span>
                ${esc(match.league?.country)}
                ·
                ${esc(match.league?.name)}
              </span>

            </div>

            <div class="match-date">
              ${esc(dt.date)}
              ·
              ${esc(dt.time)}
            </div>

          </div>


          <div class="teams">

            <div class="team">

              <img
                src="${esc(match.home?.logo || "")}"
                alt=""
              >

              ${esc(match.home?.name)}

            </div>


            <div class="score">

              ${
                match.status === "NS"
                  ? `
                    VS
                    <div class="kickoff-time">
                      ${esc(dt.time)}
                    </div>
                  `
                  : `
                    ${match.score?.home ?? "-"}
                    -
                    ${match.score?.away ?? "-"}
                  `
              }

              ${
                live
                  ? `
                    <div class="minute">
                      ${esc(minute)}
                    </div>
                  `
                  : ""
              }

            </div>


            <div class="team">

              <img
                src="${esc(match.away?.logo || "")}"
                alt=""
              >

              ${esc(match.away?.name)}

            </div>

          </div>


          <div class="actions">

            <div
              class="status ${
                live
                  ? "live-status"
                  : ""
              }"
            >
              ${
                live
                  ? `● CANLI ${esc(minute)}`
                  : match.status === "NS"
                    ? `Başlama: ${esc(dt.date)} ${esc(dt.time)}`
                    : `Durum: ${esc(match.status)}`
              }
            </div>

            ${
              match.status === "NS"
                ? `
                  <button
                    class="pred-btn"
                    onclick="loadPrediction(${Number(match.id)},this)"
                  >
                    Analizi Gör
                  </button>
                `
                : `
                  <button
                    class="detail-btn"
                    onclick="openLiveDetail(${Number(match.id)})"
                  >
                    ${
                      live
                        ? "Canlı Detay"
                        : "Maç Detayı"
                    }
                  </button>
                `
            }

          </div>

          <div
            class="pred"
            id="pred-${Number(match.id)}"
          ></div>

        </article>
        `;
      }
    ).join("");
}


/* TAHMİN */

async function loadPrediction(
  fixture,
  button
){

  const box =
    document.getElementById(
      "pred-" + fixture
    );

  box.classList.add("show");

  box.textContent =
    "Analiz hazırlanıyor...";

  button.disabled = true;

  try{

    const response =
      await fetch(
        `/api/prediction?fixture=${fixture}`
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){
      throw new Error(
        data.error ||
        "Tahmin alınamadı."
      );
    }

    const prediction =
      data.prediction || {};

    const model =
      data.model || null;

    const playerElo =
      data.playerElo || {
        available:false
      };

    const consensus =
      data.consensus || {};

    const hasPlayerElo =
      Boolean(
        data.sources?.playerElo &&
        playerElo.available
      );

    let html =
      `
      <div class="pred-title">
        ${esc(
          trAdvice(
            prediction.advice
          )
        )}
      </div>

      <div class="pred-grid">

        <div class="pill">
          Ev Sahibi
          <b>
            ${esc(prediction.percent?.home || "-")}
          </b>
        </div>

        <div class="pill">
          Beraberlik
          <b>
            ${esc(prediction.percent?.draw || "-")}
          </b>
        </div>

        <div class="pill">
          Deplasman
          <b>
            ${esc(prediction.percent?.away || "-")}
          </b>
        </div>

      </div>
      `;

    if(model){

      const over15 =
        hasPlayerElo &&
        consensus.over15 != null
          ? consensus.over15
          : model.over15;

      const over25 =
        hasPlayerElo &&
        consensus.over25 != null
          ? consensus.over25
          : model.over25;

      const btts =
        hasPlayerElo &&
        consensus.btts != null
          ? consensus.btts
          : model.btts;

      const best =
        [
          {
            name:"1.5 Üst",
            value:over15
          },
          {
            name:"2.5 Üst",
            value:over25
          },
          {
            name:"KG Var",
            value:btts
          }
        ].sort(
          (a,b) =>
            b.value - a.value
        )[0];

      html +=
        `
        <div class="model">

          <h4>
            ${
              hasPlayerElo
                ? "MaçAnaliz AI Çoklu Kaynak Analizi"
                : "MaçAnaliz AI Model Analizi"
            }
          </h4>

          <div class="model-grid">

            <div class="model-card">
              1.5 Üst
              <strong>${over15}%</strong>
              <span class="conf">
                ${
                  hasPlayerElo
                    ? "Konsensüs"
                    : "Model"
                }
              </span>
            </div>

            <div class="model-card">
              2.5 Üst
              <strong>${over25}%</strong>
              <span class="conf">
                ${
                  hasPlayerElo
                    ? "Konsensüs"
                    : "Model"
                }
              </span>
            </div>

            <div class="model-card">
              KG Var
              <strong>${btts}%</strong>
              <span class="conf">
                ${
                  hasPlayerElo
                    ? "Konsensüs"
                    : "Model"
                }
              </span>
            </div>

          </div>


          <div class="consensus-box">

            <div class="consensus-title">
              ${
                hasPlayerElo
                  ? "En Güçlü Konsensüs Sinyali"
                  : "En Güçlü Model Sinyali"
              }
            </div>

            <div class="consensus-value">
              ${esc(best.name)}
              ·
              ${best.value}%
            </div>

            <div class="consensus-sub">
              ${
                hasPlayerElo
                  ? "2 bağımsız kaynak birlikte değerlendirildi."
                  : "Çoklu kaynak doğrulaması bu maç için mevcut değil."
              }
            </div>

          </div>


          <div class="analysis-details">

            <div class="analysis-title">
              Gol Analizi
            </div>

            <div class="analysis-row">
              <span>MaçAnaliz 1.5 Üst</span>
              <b>${model.over15}%</b>
            </div>

            <div class="analysis-row">
              <span>MaçAnaliz 2.5 Üst</span>
              <b>${model.over25}%</b>
            </div>

            <div class="analysis-row">
              <span>MaçAnaliz KG Var</span>
              <b>${model.btts}%</b>
            </div>

          </div>


          <div class="source-badges">

            <span class="source-badge active">
              ✓ API-Football
            </span>

            <span class="source-badge active">
              ✓ MaçAnaliz Model
            </span>

            <span
              class="source-badge ${
                hasPlayerElo
                  ? "active"
                  : "warn"
              }"
            >
              ${
                hasPlayerElo
                  ? "✓ PlayerElo"
                  : "PlayerElo · Bu maçta veri yok"
              }
            </span>

          </div>

          <div class="note">
            Tahminler garanti değildir.
          </div>

        </div>
        `;

      const match =
        matches.find(
          x =>
            Number(x.id) ===
            Number(fixture)
        );

      saveStrongPick(
        match,
        prediction,
        {
          ...model,
          over15,
          over25,
          btts
        }
      );
    }

    box.innerHTML = html;

  }catch(error){

    box.textContent =
      "Bu maç için analiz verisi alınamadı.";

    button.disabled = false;
  }
}


/* CANLI DETAY */

function showValue(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "-";
  }

  return esc(value);
}


function statRow(
  name,
  home,
  away
){

  if(
    home == null &&
    away == null
  ){
    return "";
  }

  return `
  <div class="stat-row">

    <div class="stat-home">
      ${showValue(home)}
    </div>

    <div class="stat-name">
      ${esc(name)}
    </div>

    <div class="stat-away">
      ${showValue(away)}
    </div>

  </div>
  `;
}


function eventIcon(type,detail){

  const t =
    String(type || "")
      .toLowerCase();

  const d =
    String(detail || "")
      .toLowerCase();

  if(t.includes("goal")){
    return "⚽";
  }

  if(t.includes("card")){

    if(d.includes("red")){
      return "🟥";
    }

    return "🟨";
  }

  if(t.includes("subst")){
    return "🔄";
  }

  return "•";
}


function renderLiveDetail(data){

  const root =
    document.getElementById(
      "liveContent"
    );

  const home =
    data.teams?.home || {};

  const away =
    data.teams?.away || {};

  const fixture =
    data.fixture || {};

  const league =
    data.league || {};

  const homeStats =
    data.statistics?.home || {};

  const awayStats =
    data.statistics?.away || {};

  const detailDate =
    fmtDateTime(
      fixture.date
    );

  let minute =
    fixture.status?.elapsed;

  if(fixture.status?.extra){
    minute =
      `${minute}+${fixture.status.extra}`;
  }

  const statsHtml =
    [
      statRow(
        "Toplam Şut",
        homeStats.totalShots,
        awayStats.totalShots
      ),

      statRow(
        "İsabetli Şut",
        homeStats.shotsOnGoal,
        awayStats.shotsOnGoal
      ),

      statRow(
        "İsabetsiz Şut",
        homeStats.shotsOffGoal,
        awayStats.shotsOffGoal
      ),

      statRow(
        "Korner",
        homeStats.corners,
        awayStats.corners
      ),

      statRow(
        "Topa Sahip Olma",
        homeStats.possession,
        awayStats.possession
      ),

      statRow(
        "Faul",
        homeStats.fouls,
        awayStats.fouls
      ),

      statRow(
        "Ofsayt",
        homeStats.offsides,
        awayStats.offsides
      ),

      statRow(
        "Sarı Kart",
        homeStats.yellowCards,
        awayStats.yellowCards
      ),

      statRow(
        "Kırmızı Kart",
        homeStats.redCards,
        awayStats.redCards
      ),

      statRow(
        "Kaleci Kurtarışı",
        homeStats.saves,
        awayStats.saves
      ),

      statRow(
        "Toplam Pas",
        homeStats.totalPasses,
        awayStats.totalPasses
      ),

      statRow(
        "Pas İsabeti",
        homeStats.passAccuracy,
        awayStats.passAccuracy
      )
    ].join("");


  const events =
    data.events?.items || [];


  const eventsHtml =
    events.length

      ? events
          .slice()
          .reverse()
          .map(
            event => {

              const time =
                event.elapsed != null
                  ? `${event.elapsed}${
                      event.extra
                        ? "+" + event.extra
                        : ""
                    }'`
                  : "-";

              return `
              <div class="event">

                <div class="event-time">
                  ${esc(time)}
                </div>

                <div class="event-main">

                  <b>
                    ${eventIcon(
                      event.type,
                      event.detail
                    )}
                    ${esc(event.team?.name || "")}
                  </b>

                  ${
                    event.player
                      ? `
                        <div>
                          ${esc(event.player)}
                        </div>
                      `
                      : ""
                  }

                  <div class="event-detail">
                    ${esc(event.detail || event.type || "")}
                  </div>

                </div>

              </div>
              `;
            }
          )
          .join("")

      : `
        <div class="no-data">
          Bu maç için olay verisi bulunmuyor.
        </div>
      `;


  root.innerHTML =
    `

    <div class="live-head">

      <div class="live-league">
        ${esc(league.country || "")}
        ·
        ${esc(league.name || "")}
      </div>

      <div class="live-score">

        <div class="live-team">

          <img
            src="${esc(home.logo || "")}"
            alt=""
          >

          ${esc(home.name || "")}

        </div>

        <div class="live-score-main">

          ${data.goals?.home ?? "-"}
          -
          ${data.goals?.away ?? "-"}

          <div class="live-minute">

            ${
              minute
                ? `${esc(minute)}'`
                : esc(
                    fixture.status?.long ||
                    fixture.status?.short ||
                    ""
                  )
            }

          </div>

        </div>

        <div class="live-team">

          <img
            src="${esc(away.logo || "")}"
            alt=""
          >

          ${esc(away.name || "")}

        </div>

      </div>


      <div class="live-meta">

        Tarih:
        ${esc(detailDate.date)}
        ·
        Saat:
        ${esc(detailDate.time)}

        ${
          fixture.venue?.name
            ? `
              <br>
              ${esc(fixture.venue.name)}
              ${
                fixture.venue.city
                  ? " · " + esc(fixture.venue.city)
                  : ""
              }
            `
            : ""
        }

      </div>

    </div>


    <div class="availability">

      <div class="availability-item ok">
        ✓ Maç Bilgisi
      </div>

      <div
        class="availability-item ${
          data.availability?.statistics
            ? "ok"
            : "no"
        }"
      >
        ${
          data.availability?.statistics
            ? "✓"
            : "—"
        }
        İstatistik
      </div>

      <div
        class="availability-item ${
          data.availability?.events
            ? "ok"
            : "no"
        }"
      >
        ${
          data.availability?.events
            ? "✓"
            : "—"
        }
        Olaylar
      </div>

    </div>


    <div class="live-section">

      <h3>
        Maç İstatistikleri
      </h3>

      ${
        statsHtml
          ? statsHtml
          : `
            <div class="no-data">
              Bu maç için istatistik verisi bulunamadı.
            </div>
          `
      }

    </div>


    <div class="live-section">

      <h3>
        Maç Olayları
      </h3>

      ${eventsHtml}

    </div>


    <div class="updated-at">
      Son güncelleme:
      ${new Intl.DateTimeFormat(
        "tr-TR",
        {
          timeZone:"Europe/Istanbul",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      ).format(new Date())}
    </div>
    `;
}


async function fetchLiveDetail(fixture){

  const root =
    document.getElementById(
      "liveContent"
    );

  const button =
    document.getElementById(
      "refreshLiveBtn"
    );

  button.disabled = true;
  button.textContent = "Yükleniyor...";

  try{

    const response =
      await fetch(
        `/api/live-detail?fixture=${fixture}&t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){
      throw new Error(
        data.error ||
        "Maç detayı alınamadı."
      );
    }

    renderLiveDetail(data);

  }catch(error){

    root.innerHTML =
      `
      <div class="error">
        <b>Maç detayı alınamadı.</b>
        <br><br>
        ${esc(error.message)}
      </div>
      `;

  }finally{

    button.disabled = false;
    button.textContent = "↻ Yenile";
  }
}


function openLiveDetail(fixture){

  activeLiveFixture =
    fixture;

  document.getElementById(
    "matchModal"
  ).classList.add(
    "show"
  );

  document.body.style.overflow =
    "hidden";

  document.getElementById(
    "liveContent"
  ).innerHTML =
    `
    <div class="loading">
      Maç detayları yükleniyor...
    </div>
    `;

  fetchLiveDetail(fixture);
}


function refreshLiveDetail(){

  if(activeLiveFixture){
    fetchLiveDetail(
      activeLiveFixture
    );
  }
}


function closeLiveDetail(){

  document.getElementById(
    "matchModal"
  ).classList.remove(
    "show"
  );

  document.body.style.overflow = "";

  activeLiveFixture = null;
}


document.getElementById(
  "matchModal"
).addEventListener(
  "click",
  event => {

    if(
      event.target.id ===
      "matchModal"
    ){
      closeLiveDetail();
    }
  }
);
