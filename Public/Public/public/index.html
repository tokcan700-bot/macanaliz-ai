<!doctype html>
<html lang="tr">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>MaçAnaliz AI</title>

<style>

:root{
  --bg:#07111f;
  --panel:#0d1b2c;
  --panel2:#101f32;
  --text:#f5f7fb;
  --muted:#91a2b7;
  --green:#19e58c;
  --line:#20334b;
  --gold:#f6c453;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    linear-gradient(
      180deg,
      #07111f,
      #091626
    );
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    Roboto,
    sans-serif;
}

button{
  font-family:inherit;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

.top{
  position:sticky;
  top:0;
  z-index:10;
  padding:13px 14px;
  background:
    rgba(7,17,31,.96);
  border-bottom:
    1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:18px;
  font-weight:900;
}

.logo b{
  color:var(--green);
}

.live{
  padding:5px 8px;
  border:
    1px solid #31506e;
  border-radius:999px;
  color:#b8c6d6;
  font-size:9px;
}

.hero{
  padding:
    18px 14px
    12px;
}

.hero h1{
  margin:
    0 0 7px;
  font-size:25px;
  line-height:1.08;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.bar{
  display:flex;
  gap:7px;
  padding:
    0 14px
    12px;
  overflow:auto;
}

.bar button{
  flex:none;
  padding:
    8px 12px;
  border:
    1px solid var(--line);
  border-radius:999px;
  background:var(--panel);
  color:#c8d4e0;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.bar button.active{
  background:var(--green);
  color:#06150e;
}

.section{
  padding:
    0 14px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:
    6px 0
    10px;
}

.section-title h2{
  margin:0;
  font-size:16px;
}

.section-title small{
  color:var(--muted);
  font-size:10px;
}

.card{
  margin-bottom:10px;
  padding:12px;
  background:
    linear-gradient(
      145deg,
      var(--panel),
      #0b1726
    );
  border:
    1px solid var(--line);
  border-radius:14px;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10px;
}

.league{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.league img{
  width:16px;
  height:16px;
  object-fit:contain;
}

.league span{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.teams{
  display:grid;
  grid-template-columns:
    1fr 48px 1fr;
  gap:7px;
  align-items:center;
  margin:
    13px 0;
}

.team{
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.team img{
  display:block;
  width:38px;
  height:38px;
  margin:
    0 auto
    6px;
  object-fit:contain;
}

.score{
  text-align:center;
  font-size:15px;
  font-weight:900;
}

.actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.status{
  display:inline-block;
  padding:
    6px 8px;
  border-radius:9px;
  background:#13283d;
  color:#cbd6e1;
  font-size:10px;
}

.pred-btn{
  padding:
    8px 10px;
  border:0;
  border-radius:9px;
  background:var(--green);
  color:#06150e;
  font-size:11px;
  font-weight:900;
}

.pred-btn:disabled{
  opacity:.55;
}

.pred{
  display:none;
  margin-top:10px;
  padding:10px;
  border:
    1px solid var(--line);
  border-radius:11px;
  background:#091524;
}

.pred.show{
  display:block;
}

.pred-title{
  margin-bottom:8px;
  font-size:12px;
  font-weight:900;
  line-height:1.4;
}

.pred-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:6px;
}

.pill{
  padding:
    7px 4px;
  border-radius:9px;
  background:#12243a;
  text-align:center;
  font-size:9px;
}

.pill b{
  display:block;
  margin-top:2px;
  color:var(--green);
  font-size:15px;
}

.model{
  margin-top:10px;
  padding-top:10px;
  border-top:
    1px solid var(--line);
}

.model h4{
  margin:
    0 0
    8px;
  color:var(--gold);
  font-size:12px;
}

.model-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:6px;
}

.model-card{
  padding:
    7px 4px;
  border:
    1px solid #263b55;
  border-radius:9px;
  background:var(--panel2);
  text-align:center;
  font-size:9px;
}

.model-card strong{
  display:block;
  margin:
    2px 0;
  color:var(--green);
  font-size:16px;
}

.conf{
  color:var(--muted);
  font-size:8px;
}

.consensus-box{
  margin-top:9px;
  padding:9px;
  border:
    1px solid #29445f;
  border-radius:9px;
  background:
    linear-gradient(
      135deg,
      #0c1d2e,
      #10253a
    );
}

.consensus-title{
  color:var(--gold);
  font-size:9px;
  font-weight:800;
}

.consensus-value{
  margin-top:2px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.consensus-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
}

.analysis-details{
  margin-top:9px;
  padding:9px;
  border:
    1px solid var(--line);
  border-radius:9px;
  background:#0b1828;
}

.analysis-title{
  margin-bottom:4px;
  color:var(--gold);
  font-size:9px;
  font-weight:900;
}

.analysis-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:
    5px 0;
  border-bottom:
    1px solid
    rgba(145,162,183,.12);
  font-size:9px;
}

.analysis-row:last-child{
  border-bottom:0;
}

.analysis-row span{
  color:var(--muted);
}

.analysis-row b{
  max-width:64%;
  text-align:right;
  color:var(--text);
}

.source-badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.source-badge{
  padding:
    4px 6px;
  border:
    1px solid #28415c;
  border-radius:999px;
  background:#11263a;
  color:#9fb1c6;
  font-size:8px;
}

.source-badge.active{
  color:var(--green);
  border-color:#176844;
}

.source-badge.warn{
  color:var(--gold);
  border-color:#755b25;
}

.note{
  margin-top:8px;
  color:var(--muted);
  font-size:8px;
  line-height:1.5;
}

.loading,
.error,
.empty{
  margin:
    18px 0;
  padding:14px;
  border:
    1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  padding:
    8px 9px;
  border-top:
    1px solid var(--line);
  background:
    rgba(7,17,31,.97);
}

.nav{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  max-width:760px;
  margin:auto;
}

.nav button{
  border:0;
  background:none;
  color:#7f91a7;
  font-size:9px;
}

.nav button span{
  display:block;
  margin-bottom:2px;
  font-size:18px;
}

.nav button.active{
  color:var(--green);
}

</style>

</head>

<body>

<main class="app">

<header class="top">

  <div class="brand">

    <div class="logo">
      ⚽ MaçAnaliz <b>AI</b>
    </div>

    <div class="live">
      CANLI VERİ
    </div>

  </div>

</header>

<section class="hero">

  <h1>
    Bugünün
    <span>gerçek maçları</span>
  </h1>

  <p>
    API-Football, MaçAnaliz istatistik modeli
    ve desteklenen maçlarda PlayerElo ile
    çoklu kaynak analizi.
  </p>

</section>

<div class="bar">

  <button
    class="active"
    data-filter="all"
  >
    Tümü
  </button>

  <button data-filter="NS">
    Başlamadı
  </button>

  <button data-filter="LIVE">
    Canlı
  </button>

  <button data-filter="FT">
    Biten
  </button>

</div>

<section class="section">

  <div class="section-title">

    <h2>
      Bugünün Maçları
    </h2>

    <small id="count">
      yükleniyor...
    </small>

  </div>

  <div id="list"></div>

</section>

</main>

<nav class="bottom">

  <div class="nav">

    <button class="active">
      <span>⌂</span>
      Ana Sayfa
    </button>

    <button>
      <span>⚽</span>
      Maçlar
    </button>

    <button>
      <span>▥</span>
      Tahminler
    </button>

    <button>
      <span>☆</span>
      Favoriler
    </button>

  </div>

</nav>

<script>

let matches = [];

let activeFilter =
  "all";

function esc(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}

const fmtTime =
  iso =>

    new Intl.DateTimeFormat(
      "tr-TR",
      {
        timeZone:
          "Europe/Istanbul",

        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    )

    .format(
      new Date(iso)
    );

const group =
  status =>

    [
      "1H",
      "HT",
      "2H",
      "ET",
      "BT",
      "P",
      "LIVE",
      "INT"
    ]

    .includes(status)

      ? "LIVE"

      : status;

function todayKey(){

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:
        "Europe/Istanbul",

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit"
    }
  )

  .format(
    new Date()
  );
}

function trAdvice(text){

  if(!text){
    return "API Tahmini";
  }

  return String(text)

    .replace(
      /^Combo Double chance\s*:\s*/i,
      "Kombine Tahmin: "
    )

    .replace(
      /^Double chance\s*:\s*/i,
      "Çifte Şans: "
    )

    .replace(
      /\bor draw\b/gi,
      "veya Beraberlik"
    )

    .replace(
      /\band\s*\+1\.5 goals\b/gi,
      " + 1.5 Üst"
    )

    .replace(
      /\band\s*\+2\.5 goals\b/gi,
      " + 2.5 Üst"
    )

    .replace(
      /\band\s*-1\.5 goals\b/gi,
      " + 1.5 Alt"
    )

    .replace(
      /\band\s*-2\.5 goals\b/gi,
      " + 2.5 Alt"
    )

    .replace(
      /\bhome\b/gi,
      "Ev Sahibi"
    )

    .replace(
      /\baway\b/gi,
      "Deplasman"
    )

    .replace(
      /\bdraw\b/gi,
      "Beraberlik"
    )

    .replace(
      /\bor\b/gi,
      "veya"
    )

    .replace(
      /\band\b/gi,
      "+"
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();
}

function strongStorageKey(){

  return (
    "macanaliz-strong-" +
    todayKey()
  );
}

function getStrongPicks(){

  try{

    return JSON.parse(
      localStorage.getItem(
        strongStorageKey()
      ) || "[]"
    );

  }catch(e){

    return [];
  }
}

function saveStrongPick(
  match,
  prediction,
  model
){

  if(
    !match ||
    !model
  ){
    return;
  }

  const strong =
    model.over15 >= 80 ||
    model.over25 >= 70 ||
    model.btts >= 70;

  if(!strong){
    return;
  }

  const picks =
    getStrongPicks();

  const item = {

    id:
      match.id,

    kickoff:
      match.kickoff,

    league: {

      name:
        match.league?.name || "",

      country:
        match.league?.country || "",

      logo:
        match.league?.logo || ""
    },

    home: {

      name:
        match.home?.name || "",

      logo:
        match.home?.logo || ""
    },

    away: {

      name:
        match.away?.name || "",

      logo:
        match.away?.logo || ""
    },

    advice:
      trAdvice(
        prediction?.advice
      ),

    model: {

      over15:
        model.over15,

      over25:
        model.over25,

      btts:
        model.btts,

      expectedGoals:
        model.expectedGoals,

      dataCount:
        model.dataCount
    }
  };

  const oldIndex =
    picks.findIndex(
      x =>
        Number(x.id) ===
        Number(match.id)
    );

  if(oldIndex >= 0){

    picks[oldIndex] =
      item;

  }else{

    picks.push(
      item
    );
  }

  picks.sort(
    (a,b) => {

      const aBest =
        Math.max(
          a.model.over15,
          a.model.over25,
          a.model.btts
        );

      const bBest =
        Math.max(
          b.model.over15,
          b.model.over25,
          b.model.btts
        );

      return (
        bBest -
        aBest
      );
    }
  );

  localStorage.setItem(
    strongStorageKey(),
    JSON.stringify(picks)
  );
}

function strongestModelPick(m){

  const picks = [

    {
      name:
        "1.5 Üst",

      value:
        m.over15
    },

    {
      name:
        "2.5 Üst",

      value:
        m.over25
    },

    {
      name:
        "KG Var",

      value:
        m.btts
    }
  ];

  picks.sort(
    (a,b) =>
      b.value -
      a.value
  );

  return picks[0];
}

function render(){

  const root =
    document.getElementById(
      "list"
    );

  document
    .querySelector(
      ".section-title h2"
    )
    .textContent =
      "Bugünün Maçları";

  const filtered =
    matches.filter(
      m =>
        activeFilter === "all" ||
        group(m.status) === activeFilter
    );

  document
    .getElementById("count")
    .textContent =
      filtered.length +
      " maç";

  if(
    !filtered.length
  ){

    root.innerHTML =
      `
      <div class="empty">
        Bu filtrede maç bulunamadı.
      </div>
      `;

    return;
  }

  root.innerHTML =
    filtered.map(
      m => `

        <article class="card">

          <div class="meta">

            <div class="league">

              ${
                m.league?.logo
                  ?
                  `
                  <img
                    src="${esc(m.league.logo)}"
                    alt=""
                  >
                  `
                  :
                  ""
              }

              <span>
                ${esc(m.league?.country)}
                ·
                ${esc(m.league?.name)}
              </span>

            </div>

            <span>
              ${fmtTime(m.kickoff)}
            </span>

          </div>

          <div class="teams">

            <div class="team">

              <img
                src="${esc(m.home?.logo || "")}"
                alt=""
              >

              ${esc(m.home?.name)}

            </div>

            <div class="score">

              ${
                m.status === "NS"

                  ? "VS"

                  : `
                    ${m.score?.home ?? "-"}
                    -
                    ${m.score?.away ?? "-"}
                  `
              }

            </div>

            <div class="team">

              <img
                src="${esc(m.away?.logo || "")}"
                alt=""
              >

              ${esc(m.away?.name)}

            </div>

          </div>

          <div class="actions">

            <div class="status">
              Durum:
              ${esc(m.status)}
            </div>

            ${
              m.status === "NS"

                ? `
                  <button
                    class="pred-btn"
                    onclick="loadPrediction(${Number(m.id)},this)"
                  >
                    Analizi Gör
                  </button>
                `

                : ""
            }

          </div>

          <div
            class="pred"
            id="pred-${Number(m.id)}"
          ></div>

        </article>
      `
    )

    .join("");
}

function strongBadges(model){

  let html =
    "";

  if(
    model.over15 >= 80
  ){

    html += `
      <div class="model-card">

        1.5 Üst

        <strong>
          ${model.over15}%
        </strong>

        <span class="conf">
          Güçlü
        </span>

      </div>
    `;
  }

  if(
    model.over25 >= 70
  ){

    html += `
      <div class="model-card">

        2.5 Üst

        <strong>
          ${model.over25}%
        </strong>

        <span class="conf">
          Güçlü
        </span>

      </div>
    `;
  }

  if(
    model.btts >= 70
  ){

    html += `
      <div class="model-card">

        KG Var

        <strong>
          ${model.btts}%
        </strong>

        <span class="conf">
          Güçlü
        </span>

      </div>
    `;
  }

  return html;
}

function renderStrongPicks(){

  const root =
    document.getElementById(
      "list"
    );

  document
    .querySelector(
      ".section-title h2"
    )
    .textContent =
      "En Güçlü Tahminler";

  const picks =
    getStrongPicks();

  document
    .getElementById("count")
    .textContent =
      picks.length +
      " maç";

  if(
    !picks.length
  ){

    root.innerHTML =
      `
      <div class="empty">

        Henüz güçlü tahmin bulunmadı.

        <br><br>

        Maçlarda
        <b>Analizi Gör</b>
        butonuna bastıkça güçlü çıkan
        tahminler burada toplanacak.

      </div>
      `;

    return;
  }

  root.innerHTML =
    picks.map(
      p => `

        <article class="card">

          <div class="meta">

            <div class="league">

              ${
                p.league?.logo
                  ?
                  `
                  <img
                    src="${esc(p.league.logo)}"
                    alt=""
                  >
                  `
                  :
                  ""
              }

              <span>
                ${esc(p.league?.country)}
                ·
                ${esc(p.league?.name)}
              </span>

            </div>

            <span>
              ${fmtTime(p.kickoff)}
            </span>

          </div>

          <div class="teams">

            <div class="team">

              <img
                src="${esc(p.home?.logo || "")}"
                alt=""
              >

              ${esc(p.home?.name)}

            </div>

            <div class="score">
              VS
            </div>

            <div class="team">

              <img
                src="${esc(p.away?.logo || "")}"
                alt=""
              >

              ${esc(p.away?.name)}

            </div>

          </div>

          <div class="pred show">

            <div class="pred-title">
              ${esc(p.advice)}
            </div>

            <div class="model">

              <h4>
                Güçlü Model Sinyalleri
              </h4>

              <div class="model-grid">
                ${strongBadges(p.model)}
              </div>

            </div>

          </div>

        </article>
      `
    )

    .join("");
}

function showPlaceholder(
  title,
  text
){

  document
    .querySelector(
      ".section-title h2"
    )
    .textContent =
      title;

  document
    .getElementById("count")
    .textContent =
      "";

  document
    .getElementById("list")
    .innerHTML =
      `
      <div class="empty">
        ${text}
      </div>
      `;
}

async function loadPrediction(
  fixture,
  btn
){

  const box =
    document.getElementById(
      "pred-" + fixture
    );

  box.classList.add(
    "show"
  );

  box.textContent =
    "Analiz hazırlanıyor...";

  btn.disabled =
    true;

  try{

    const response =
      await fetch(
        `/api/prediction?fixture=${fixture}`
      );

    const data =
      await response.json();

    if(
      !data.success
    ){
      throw new Error();
    }

    const p =
      data.prediction || {};

    const m =
      data.model || null;

    const pe =
      data.playerElo || {
        available:false
      };

    const consensus =
      data.consensus || {};

    const sources =
      data.sources || {};

    const hasPlayerElo =
      Boolean(
        sources.playerElo &&
        pe.available
      );

    let html = `
      <div class="pred-title">
        ${esc(trAdvice(p?.advice))}

        hasPlayerElo &&

        m.dataCount >= 7

          : m.dataCount >= 4

              Gol Analizi

            <div class="analysis-row">

              <span>
                MaçAnaliz 1.5 Üst
              </span>

              <b>
                ${m.over15}%
              </b>

            ${
              hasPlayerElo

                ? `
                  <div class="analysis-row">

                    <span>
                      PlayerElo 1.5 Üst
                    </span>

                    <b>
                      ${pe.over15 ?? "-"}%
                    </b>

                  </div>

                  <div class="analysis-row">

                    <span>
                      Konsensüs 1.5 Üst
                    </span>

                    <b>
                      ${finalOver15}%
                    </b>

                  </div>
                `

            <div class="analysis-row">

              <span>
                MaçAnaliz 2.5 Üst

                ${m.over25}%
              </b>

              hasPlayerElo

                ? `
                  <div class="analysis-row">

                    <span>
                      PlayerElo 2.5 Üst
                    </span>

                    <b>
                      ${pe.over25 ?? "-"}%
                    </b>

                  </div>

                  <div class="analysis-row">

                    <span>
                      Konsensüs 2.5 Üst
                    </span>

                    <b>
                      ${finalOver25}%
                    </b>

                  </div>
                `

            }

            <div class="analysis-row">

              <span>
                MaçAnaliz KG Var
              </span>

              <b>
                ${m.btts}%
              </b>

            </div>

                ? `
                  <div class="analysis-row">

                    <span>
                      PlayerElo KG Var
                    </span>

                    <b>
                      ${pe.btts ?? "-"}%
                    </b>

                  </div>

                  <div class="analysis-row">

                    <span>
                      Konsensüs KG Var
                    </span>

                    <b>
                      ${finalBtts}%
                    </b>

                  </div>
                `

          <div class="analysis-details">

            <div class="analysis-title">
              Maç Sonucu Analizi
            </div>

            <div class="analysis-row">

              <span>
                API-Football
              </span>

              <b>
                Ev ${esc(p?.percent?.home || "-")}
                ·
                X ${esc(p?.percent?.draw || "-")}
                ·
                Dep ${esc(p?.percent?.away || "-")}
              </b>

            </div>

            ${
              hasPlayerElo

                ? `
                  <div class="analysis-row">

                    <span>
                      PlayerElo
                    </span>

                    <b>
                      Ev ${pe.home ?? "-"}%
                      ·
                      X ${pe.draw ?? "-"}%
                      ·
                      Dep ${pe.away ?? "-"}%
                    </b>

                  </div>

                  <div class="analysis-row">

                    <span>
                      Çoklu Kaynak Ortalaması
                    </span>

                    <b>
                      Ev ${consensus.home ?? "-"}%
                      ·

            <div class="analysis-row">

            }

      const match =
        matches.find(
          item =>
            Number(item.id) ===
            Number(fixture)
        );

      saveStrongPick(
        match,
        p,
        {
          ...m,

          over15:
            finalOver15,

          over25:
            finalOver25,

          btts:
            finalBtts
        }
      );
    }

    box.innerHTML =
      html;

  }catch(e){

    box.textContent =
      "Bu maç için analiz verisi alınamadı veya API kotası doldu.";

    btn.disabled =
      false;

document
  .querySelectorAll(
    ".bar button"
  )
  .forEach(
    btn => {

      btn.onclick =
        () => {

          document
            .querySelectorAll(
              ".bar button"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          btn.classList.add(
            "active"
          );

          activeFilter =
            btn.dataset.filter;

          render();
        };
    }
  );

const navButtons =
  document.querySelectorAll(
    ".nav button"
  );

function setNavActive(index){

  navButtons.forEach(
    button =>
      button.classList.remove(
        "active"
      )
  );

  navButtons[index]
    .classList.add(
      "active"
    );
}

navButtons[0].onclick =
  () => {

    setNavActive(0);

    document
      .querySelector(".bar")
      .style.display =
        "flex";

    activeFilter =
      "all";

    document
      .querySelectorAll(
        ".bar button"
      )
      .forEach(
        (button,index) => {

          button.classList.toggle(
            "active",
            index === 0
          );
        }
      );

    render();
  };

navButtons[1].onclick =
  () => {

    setNavActive(1);

    document
      .querySelector(".bar")
      .style.display =
        "flex";

    render();
  };

navButtons[2].onclick =
  () => {

    setNavActive(2);

    document
      .querySelector(".bar")
      .style.display =
        "none";

    renderStrongPicks();
  };

navButtons[3].onclick =
  () => {

    setNavActive(3);

    document
      .querySelector(".bar")
      .style.display =
        "none";

    showPlaceholder(
      "Favoriler",
      "Favorilere maç ekleme özelliğini sonraki geliştirmede aktif edeceğiz."
    );
  };

(async()=>{

  const root =
    document.getElementById(
      "list"
    );

  root.innerHTML =
    `
    <div class="loading">
      Gerçek maç verileri yükleniyor...
    </div>
    `;

  try{

    const response =
      await fetch(
        "/api/fixtures",
        {
          cache:
            "no-store"
        }
      );

    const data =
      await response.json();

    if(
      !data.success
    ){
      throw new Error();
    }

    matches =
      data.matches || [];

    render();

  }catch(e){

    document
      .getElementById("count")
      .textContent =
        "hata";

    root.innerHTML =
      `
      <div class="error">
        Maç verileri yüklenemedi.
      </div>
      `;
  }

})();

</script>
