<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>
<title>MaçAnaliz AI</title>

<style>
:root{
  --bg:#07111f;
  --panel:#0d1b2c;
  --panel2:#101f32;
  --text:#f5f7fb;
  --muted:#91a2b7;
  --green:#19e58c;
  --line:#20334b;
  --gold:#f6c453;
  --red:#ff6376;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(180deg,#07111f,#091626);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

button{
  font-family:inherit;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

.top{
  position:sticky;
  top:0;
  z-index:10;
  padding:13px 14px;
  background:rgba(7,17,31,.96);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:18px;
  font-weight:900;
}

.logo b{
  color:var(--green);
}

.live{
  padding:5px 8px;
  border:1px solid #31506e;
  border-radius:999px;
  color:#b8c6d6;
  font-size:9px;
}

.hero{
  padding:18px 14px 12px;
}

.hero h1{
  margin:0 0 7px;
  font-size:25px;
  line-height:1.08;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.bar{
  display:flex;
  gap:7px;
  padding:0 14px 12px;
  overflow:auto;
}

.bar button{
  flex:none;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel);
  color:#c8d4e0;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.bar button.active{
  background:var(--green);
  color:#06150e;
}

.section{
  padding:0 14px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 0 10px;
}

.section-title h2{
  margin:0;
  font-size:16px;
}

.section-title small{
  color:var(--muted);
  font-size:10px;
}

.card{
  margin-bottom:10px;
  padding:12px;
  background:linear-gradient(145deg,var(--panel),#0b1726);
  border:1px solid var(--line);
  border-radius:14px;
}

.card.live-card{
  border-color:#176844;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10px;
}

.league{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.league img{
  width:16px;
  height:16px;
  object-fit:contain;
}

.league span{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.teams{
  display:grid;
  grid-template-columns:1fr 55px 1fr;
  gap:7px;
  align-items:center;
  margin:13px 0;
}

.team{
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.team img{
  display:block;
  width:38px;
  height:38px;
  margin:0 auto 6px;
  object-fit:contain;
}

.score{
  text-align:center;
  font-size:16px;
  font-weight:900;
}

.minute{
  margin-top:3px;
  color:var(--green);
  font-size:9px;
}

.actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.status{
  display:inline-block;
  padding:6px 8px;
  border-radius:9px;
  background:#13283d;
  color:#cbd6e1;
  font-size:10px;
}

.status.live-status{
  color:var(--green);
  border:1px solid #176844;
}

.pred-btn,
.detail-btn,
.refresh-btn{
  padding:8px 10px;
  border:0;
  border-radius:9px;
  font-size:11px;
  font-weight:900;
}

.pred-btn{
  background:var(--green);
  color:#06150e;
}

.detail-btn{
  background:#152a40;
  color:var(--green);
  border:1px solid #176844;
}

.refresh-btn{
  background:var(--green);
  color:#06150e;
}

.pred-btn:disabled,
.detail-btn:disabled,
.refresh-btn:disabled{
  opacity:.55;
}

.pred{
  display:none;
  margin-top:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#091524;
}

.pred.show{
  display:block;
}

.pred-title{
  margin-bottom:8px;
  font-size:12px;
  font-weight:900;
  line-height:1.4;
}

.pred-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.pill{
  padding:7px 4px;
  border-radius:9px;
  background:#12243a;
  text-align:center;
  font-size:9px;
}

.pill b{
  display:block;
  margin-top:2px;
  color:var(--green);
  font-size:15px;
}

.model{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.model h4{
  margin:0 0 8px;
  color:var(--gold);
  font-size:12px;
}

.model-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.model-card{
  padding:7px 4px;
  border:1px solid #263b55;
  border-radius:9px;
  background:var(--panel2);
  text-align:center;
  font-size:9px;
}

.model-card strong{
  display:block;
  margin:2px 0;
  color:var(--green);
  font-size:16px;
}

.conf{
  color:var(--muted);
  font-size:8px;
}

.consensus-box{
  margin-top:9px;
  padding:9px;
  border:1px solid #29445f;
  border-radius:9px;
  background:linear-gradient(135deg,#0c1d2e,#10253a);
}

.consensus-title{
  color:var(--gold);
  font-size:9px;
  font-weight:800;
}

.consensus-value{
  margin-top:2px;
  color:var(--green);
  font-size:17px;
  font-weight:900;
}

.consensus-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
}

.analysis-details{
  margin-top:9px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0b1828;
}

.analysis-title{
  margin-bottom:4px;
  color:var(--gold);
  font-size:9px;
  font-weight:900;
}

.analysis-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:5px 0;
  border-bottom:1px solid rgba(145,162,183,.12);
  font-size:9px;
}

.analysis-row:last-child{
  border-bottom:0;
}

.analysis-row span{
  color:var(--muted);
}

.analysis-row b{
  max-width:64%;
  text-align:right;
  color:var(--text);
}

.source-badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.source-badge{
  padding:4px 6px;
  border:1px solid #28415c;
  border-radius:999px;
  background:#11263a;
  color:#9fb1c6;
  font-size:8px;
}

.source-badge.active{
  color:var(--green);
  border-color:#176844;
}

.source-badge.warn{
  color:var(--gold);
  border-color:#755b25;
}

.note{
  margin-top:8px;
  color:var(--muted);
  font-size:8px;
  line-height:1.5;
}

.loading,
.error,
.empty{
  margin:18px 0;
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.error{
  color:#ff98a4;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  padding:8px 9px;
  border-top:1px solid var(--line);
  background:rgba(7,17,31,.97);
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  max-width:760px;
  margin:auto;
}

.nav button{
  border:0;
  background:none;
  color:#7f91a7;
  font-size:9px;
}

.nav button span{
  display:block;
  margin-bottom:2px;
  font-size:18px;
}

.nav button.active{
  color:var(--green);
}


/* MAÇ DETAY MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(2,8,16,.88);
  backdrop-filter:blur(6px);
}

.modal.show{
  display:block;
}

.modal-sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-width:760px;
  max-height:92vh;
  margin:auto;
  overflow:auto;
  background:#091625;
  border:1px solid #29415d;
  border-bottom:0;
  border-radius:22px 22px 0 0;
  padding:12px 14px 35px;
}

.modal-head{
  position:sticky;
  top:-12px;
  z-index:3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  background:#091625;
}

.modal-title{
  font-size:14px;
  font-weight:900;
}

.modal-actions{
  display:flex;
  gap:6px;
  align-items:center;
}

.close-btn{
  width:34px;
  height:34px;
  border:1px solid #304a68;
  border-radius:50%;
  background:#10243a;
  color:white;
  font-size:18px;
}

.live-head{
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0d1b2c;
}

.live-league{
  color:var(--muted);
  font-size:9px;
  text-align:center;
}

.live-score{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.live-team{
  text-align:center;
  font-size:11px;
  font-weight:800;
}

.live-team img{
  display:block;
  width:44px;
  height:44px;
  margin:0 auto 5px;
  object-fit:contain;
}

.live-score-main{
  text-align:center;
  font-size:24px;
  font-weight:900;
}

.live-minute{
  margin-top:3px;
  color:var(--green);
  font-size:10px;
  font-weight:800;
}

.live-meta{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:8px;
  line-height:1.5;
}

.availability{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

.availability-item{
  padding:7px 4px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0f2033;
  text-align:center;
  font-size:8px;
  color:var(--muted);
}

.availability-item.ok{
  border-color:#176844;
  color:var(--green);
}

.availability-item.no{
  border-color:#725e28;
  color:var(--gold);
}

.live-section{
  margin-top:10px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0b1828;
}

.live-section h3{
  margin:0 0 8px;
  color:var(--gold);
  font-size:11px;
}

.stat-row{
  display:grid;
  grid-template-columns:1fr 115px 1fr;
  align-items:center;
  gap:6px;
  padding:7px 0;
  border-bottom:1px solid rgba(145,162,183,.1);
  font-size:9px;
}

.stat-row:last-child{
  border-bottom:0;
}

.stat-home{
  text-align:right;
  font-weight:800;
}

.stat-name{
  text-align:center;
  color:var(--muted);
  font-size:8px;
}

.stat-away{
  text-align:left;
  font-weight:800;
}

.event{
  display:grid;
  grid-template-columns:38px 1fr;
  gap:7px;
  padding:8px 0;
  border-bottom:1px solid rgba(145,162,183,.1);
}

.event:last-child{
  border-bottom:0;
}

.event-time{
  color:var(--green);
  font-size:10px;
  font-weight:900;
}

.event-main{
  font-size:9px;
  line-height:1.4;
}

.event-main b{
  font-size:10px;
}

.event-detail{
  color:var(--muted);
  font-size:8px;
}

.no-data{
  color:var(--muted);
  font-size:9px;
  line-height:1.5;
}

.debug-box{
  margin-top:10px;
  padding:9px;
  border:1px solid #604d25;
  border-radius:10px;
  background:#1a1720;
  color:#d8c68f;
  font-size:8px;
  line-height:1.5;
}

.updated-at{
  margin-top:8px;
  text-align:center;
  color:var(--muted);
  font-size:8px;
}
</style>
</head>

<body>

<main class="app">

<header class="top">
  <div class="brand">
    <div class="logo">
      ⚽ MaçAnaliz <b>AI</b>
    </div>

    <div class="live">
      CANLI VERİ
    </div>
  </div>
</header>


<section class="hero">
  <h1>
    Bugünün
    <span>gerçek maçları</span>
  </h1>

  <p>
    Canlı skor, maç olayları, istatistikler,
    API-Football ve MaçAnaliz AI tahmin modeli.
  </p>
</section>


<div class="bar">
  <button
    class="active"
    data-filter="all"
  >
    Tümü
  </button>

  <button data-filter="NS">
    Başlamadı
  </button>

  <button data-filter="LIVE">
    Canlı
  </button>

  <button data-filter="FT">
    Biten
  </button>
</div>


<section class="section">

  <div class="section-title">
    <h2>
      Bugünün Maçları
    </h2>

    <small id="count">
      yükleniyor...
    </small>
  </div>

  <div id="list"></div>

</section>

</main>


<nav class="bottom">
  <div class="nav">

    <button class="active">
      <span>⌂</span>
      Ana Sayfa
    </button>

    <button>
      <span>⚽</span>
      Maçlar
    </button>

    <button>
      <span>▥</span>
      Tahminler
    </button>

    <button>
      <span>☆</span>
      Favoriler
    </button>

  </div>
</nav>


<div
  class="modal"
  id="matchModal"
>

  <div class="modal-sheet">

    <div class="modal-head">

      <div class="modal-title">
        Maç Detayı
      </div>

      <div class="modal-actions">

        <button
          class="refresh-btn"
          id="refreshLiveBtn"
          onclick="refreshLiveDetail()"
        >
          ↻ Yenile
        </button>

        <button
          class="close-btn"
          onclick="closeLiveDetail()"
        >
          ×
        </button>

      </div>

    </div>

    <div id="liveContent">
      <div class="loading">
        Maç detayları yükleniyor...
      </div>
    </div>

  </div>
</div>


<script>

let matches = [];
let activeFilter = "all";
let activeLiveFixture = null;


function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function fmtTime(iso){
  return new Intl.DateTimeFormat(
    "tr-TR",
    {
      timeZone:"Europe/Istanbul",
      hour:"2-digit",
      minute:"2-digit"
    }
  ).format(
    new Date(iso)
  );
}


function group(status){

  const liveStatuses = [
    "1H",
    "HT",
    "2H",
    "ET",
    "BT",
    "P",
    "LIVE",
    "INT"
  ];

  const finishedStatuses = [
    "FT",
    "AET",
    "PEN"
  ];

  if(
    liveStatuses.includes(status)
  ){
    return "LIVE";
  }

  if(
    finishedStatuses.includes(status)
  ){
    return "FT";
  }

  return status;
}


function isLive(status){
  return group(status) === "LIVE";
}


function todayKey(){
  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Istanbul",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(
    new Date()
  );
}


function trAdvice(text){

  if(!text){
    return "API Tahmini";
  }

  return String(text)

    .replace(
      /^Combo Double chance\s*:\s*/i,
      "Kombine Tahmin: "
    )

    .replace(
      /^Double chance\s*:\s*/i,
      "Çifte Şans: "
    )

    .replace(
      /\bor draw\b/gi,
      "veya Beraberlik"
    )

    .replace(
      /\band\s*\+1\.5 goals\b/gi,
      " + 1.5 Üst"
    )

    .replace(
      /\band\s*\+2\.5 goals\b/gi,
      " + 2.5 Üst"
    )

    .replace(
      /\band\s*-1\.5 goals\b/gi,
      " + 1.5 Alt"
    )

    .replace(
      /\band\s*-2\.5 goals\b/gi,
      " + 2.5 Alt"
    )

    .replace(
      /\bhome\b/gi,
      "Ev Sahibi"
    )

    .replace(
      /\baway\b/gi,
      "Deplasman"
    )

    .replace(
      /\bdraw\b/gi,
      "Beraberlik"
    )

    .replace(
      /\bor\b/gi,
      "veya"
    )

    .replace(
      /\band\b/gi,
      "+"
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();
}


function strongStorageKey(){
  return (
    "macanaliz-strong-" +
    todayKey()
  );
}


function getStrongPicks(){

  try{
    return JSON.parse(
      localStorage.getItem(
        strongStorageKey()
      ) || "[]"
    );

  }catch(e){
    return [];
  }
}


function saveStrongPick(
  match,
  prediction,
  model
){

  if(
    !match ||
    !model
  ){
    return;
  }

  const strong =
    model.over15 >= 80 ||
    model.over25 >= 70 ||
    model.btts >= 70;

  if(!strong){
    return;
  }

  const picks =
    getStrongPicks();

  const item = {
    id:match.id,
    kickoff:match.kickoff,
    league:match.league,
    home:match.home,
    away:match.away,

    advice:
      trAdvice(
        prediction?.advice
      ),

    model:{
      over15:model.over15,
      over25:model.over25,
      btts:model.btts,
      expectedGoals:model.expectedGoals,
      dataCount:model.dataCount
    }
  };

  const oldIndex =
    picks.findIndex(
      x =>
        Number(x.id) ===
        Number(match.id)
    );

  if(oldIndex >= 0){
    picks[oldIndex] = item;
  }else{
    picks.push(item);
  }

  picks.sort(
    (a,b) => {

      const aBest =
        Math.max(
          a.model.over15,
          a.model.over25,
          a.model.btts
        );

      const bBest =
        Math.max(
          b.model.over15,
          b.model.over25,
          b.model.btts
        );

      return bBest - aBest;
    }
  );

  localStorage.setItem(
    strongStorageKey(),
    JSON.stringify(picks)
  );
}


function render(){

  const root =
    document.getElementById(
      "list"
    );

  document
    .querySelector(
      ".section-title h2"
    )
    .textContent =
      "Bugünün Maçları";

  const filtered =
    matches.filter(
      m =>
        activeFilter === "all" ||
        group(m.status) === activeFilter
    );

  document
    .getElementById("count")
    .textContent =
      filtered.length +
      " maç";

  if(!filtered.length){

    root.innerHTML =
      `
      <div class="empty">
        Bu filtrede maç bulunamadı.
      </div>
      `;

    return;
  }

  root.innerHTML =
    filtered.map(
      m => {

        const live =
          isLive(m.status);

        const minute =
          m.elapsed
            ? `${m.elapsed}'`
            : "";

        return `

          <article
            class="card ${
              live
                ? "live-card"
                : ""
            }"
          >

            <div class="meta">

              <div class="league">

                ${
                  m.league?.logo

                    ? `
                      <img
                        src="${esc(m.league.logo)}"
                        alt=""
                      >
                    `

                    : ""
                }

                <span>
                  ${esc(m.league?.country)}
                  ·
                  ${esc(m.league?.name)}
                </span>

              </div>

              <span>
                ${fmtTime(m.kickoff)}
              </span>

            </div>


            <div class="teams">

              <div class="team">

                <img
                  src="${esc(m.home?.logo || "")}"
                  alt=""
                >

                ${esc(m.home?.name)}

              </div>


              <div class="score">

                ${
                  m.status === "NS"

                    ? "VS"

                    : `
                      ${m.score?.home ?? "-"}
                      -
                      ${m.score?.away ?? "-"}
                    `
                }

async function loadPrediction(
  fixture,
  btn
){

  const box =
    document.getElementById(
      "pred-" + fixture
    );

  box.classList.add(
    "show"
  );

  box.textContent =
    "Analiz hazırlanıyor...";

  btn.disabled =
    true;

  try{

    const response =
      await fetch(
        `/api/prediction?fixture=${fixture}`
      );

    const data =
      await response.json();

    if(!data.success){
      throw new Error();
    }

    const p =
      data.prediction || {};

    const m =
      data.model || null;

    const pe =
      data.playerElo || {
        available:false
      };

    const consensus =
      data.consensus || {};

    const sources =
      data.sources || {};

    const hasPlayerElo =
      Boolean(
        sources.playerElo &&
        pe.available
      );

    let html = `
      <div class="pred-title">
        ${esc(trAdvice(p?.advice))}
      </div>

      <div class="pred-grid">

        <div class="pill">
          Ev Sahibi
          <b>
            ${esc(p?.percent?.home || "-")}
          </b>
        </div>

        <div class="pill">
          Beraberlik
          <b>
            ${esc(p?.percent?.draw || "-")}
          </b>
        </div>

        <div class="pill">
          Deplasman
          <b>
            ${esc(p?.percent?.away || "-")}
          </b>
        </div>

      </div>
    `;

    if(m){

      const finalOver15 =
        hasPlayerElo &&
        Number.isFinite(
          Number(consensus.over15)
        )
          ? Number(consensus.over15)
          : m.over15;

      const finalOver25 =
        hasPlayerElo &&
        Number.isFinite(
          Number(consensus.over25)
        )
          ? Number(consensus.over25)
          : m.over25;

      const finalBtts =
        hasPlayerElo &&
        Number.isFinite(
          Number(consensus.btts)
        )
          ? Number(consensus.btts)
          : m.btts;

      const bestValues = [
        {
          name:"1.5 Üst",
          value:finalOver15
        },
        {
          name:"2.5 Üst",
          value:finalOver25
        },
        {
          name:"KG Var",
          value:finalBtts
        }
      ];

      bestValues.sort(
        (a,b) =>
          b.value - a.value
      );

      const best =
        bestValues[0];

      const dataQuality =
        m.dataCount >= 7
          ? "Yüksek"
          : m.dataCount >= 4
            ? "Orta"
            : "Düşük";

      html += `

        <div class="model">

          <h4>
            ${
              hasPlayerElo
                ? "MaçAnaliz AI Çoklu Kaynak Analizi"
                : "MaçAnaliz AI Model Analizi"

          <div class="model-grid">

            <div class="model-card">
              1.5 Üst
              <strong>
                ${finalOver15}%
              </strong>
              <span class="conf">
                ${
                  hasPlayerElo
                    ? "Konsensüs"
                    : "Model"
                }
              </span>
            </div>

            <div class="model-card">
              2.5 Üst
              <strong>
                ${finalOver25}%
              </strong>
              <span class="conf">
                ${
                  hasPlayerElo
                    ? "Konsensüs"
                    : "Model"
                }
              </span>
            </div>

            <div class="model-card">
              KG Var
              <strong>
                ${finalBtts}%
              </strong>
              <span class="conf">
                ${
                  hasPlayerElo
                    ? "Konsensüs"
                    : "Model"
                }
              </span>
            </div>

          </div>


          <div class="consensus-box">

            <div class="consensus-title">
              ${
                hasPlayerElo
                  ? "En Güçlü Konsensüs Sinyali"
                  : "En Güçlü Model Sinyali"
              }
            </div>

            <div class="consensus-value">
              ${esc(best.name)}
              ·
              ${best.value}%
            </div>

            <div class="consensus-sub">
              ${
                hasPlayerElo
                  ? "2 bağımsız kaynak birlikte değerlendirildi."
                  : "Çoklu kaynak doğrulaması bu maç için mevcut değil."
              }
            </div>

          </div>


          <div class="analysis-details">

            <div class="analysis-title">
              Gol Analizi
            </div>

            <div class="analysis-row">
              <span>MaçAnaliz 1.5 Üst</span>
              <b>${m.over15}%</b>
            </div>

            <div class="analysis-row">
              <span>MaçAnaliz 2.5 Üst</span>
              <b>${m.over25}%</b>
            </div>

            <div class="analysis-row">
              <span>MaçAnaliz KG Var</span>
              <b>${m.btts}%</b>
            </div>

            ${
              hasPlayerElo

                  <div class="analysis-row">
                    <span>PlayerElo 1.5 Üst</span>
                    <b>${pe.over15 ?? "-"}%</b>
                  </div>

                  <div class="analysis-row">
                    <span>PlayerElo 2.5 Üst</span>

                  </div>

                    <b>${pe.btts ?? "-"}%</b>
                  </div>

                : ""
            }

          </div>


          <div class="analysis-details">

            <div class="analysis-title">
              Maç Sonucu Analizi
            </div>

            <div class="analysis-row">

              <span>
                API-Football
              </span>

              <b>
                Ev ${esc(p?.percent?.home || "-")}
                ·
                X ${esc(p?.percent?.draw || "-")}
                ·
                Dep ${esc(p?.percent?.away || "-")}
              </b>

            </div>

            ${
              hasPlayerElo
                ? `
                  <div class="analysis-row">

                    <span>
                      PlayerElo
                    </span>

                    <b>
                      Ev ${pe.home ?? "-"}%
                      ·
                      X ${pe.draw ?? "-"}%
                      ·
                      Dep ${pe.away ?? "-"}%
                    </b>

                  </div>
                `
                : ""
            }

            <div class="analysis-row">

              <span>
                API Görüşü
              </span>

              <b>
                ${esc(trAdvice(p?.advice))}
              </b>

            </div>

          </div>


          <div class="analysis-details">

            <div class="analysis-title">
              Model Detayları
            </div>

            <div class="analysis-row">
              <span>Gol Beklentisi</span>
              <b>
                ${m.expectedGoals?.home ?? "-"}
                -
                ${m.expectedGoals?.away ?? "-"}
              </b>
            </div>

            <div class="analysis-row">
              <span>Toplam Gol Beklentisi</span>
              <b>${m.expectedGoals?.total ?? "-"}</b>
            </div>

            <div class="analysis-row">
              <span>Veri Kalitesi</span>
              <b>${dataQuality}</b>
            </div>

            <div class="analysis-row">
              <span>Kullanılan Veri</span>
              <b>${m.dataCount ?? 0}/8</b>
            </div>

          </div>


          <div class="source-badges">

            <span class="source-badge active">
              ✓ API-Football
            </span>

            <span class="source-badge active">
              ✓ MaçAnaliz Model
            </span>

            <span
              class="source-badge ${
                hasPlayerElo
                  ? "active"
                  : "warn"
              }"
            >
              ${
                hasPlayerElo
                  ? "✓ PlayerElo"
                  : "PlayerElo · Bu maçta veri yok"
              }
            </span>

          </div>


          <div class="note">

            ${
              hasPlayerElo
                ? "Bu maçta çoklu kaynak doğrulaması mevcut."
                : "Bu maç için PlayerElo tahmini bulunmadığından model tek kaynaklı gösterilir."
            }

            Tahminler garanti değildir.

          </div>

        </div>
      `;

      const match =
        matches.find(
          item =>
            Number(item.id) ===
            Number(fixture)
        );

      saveStrongPick(
        match,
        p,
        {
          ...m,
          over15:finalOver15,
          over25:finalOver25,
          btts:finalBtts
        }
      );
    }

    box.innerHTML =
      html;

  }catch(e){

    box.textContent =
      "Bu maç için analiz verisi alınamadı veya API kotası doldu.";

    btn.disabled =
      false;
  }
}


/* CANLI MAÇ DETAYI */


function showValue(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "-";
  }

  return esc(value);
}


function eventIcon(type,detail){

  const t =
    String(type || "")
      .toLowerCase();

  const d =
    String(detail || "")
      .toLowerCase();

  if(
    t.includes("goal")
  ){
    return "⚽";
  }

  if(
    t.includes("card")
  ){

    if(
      d.includes("red")
    ){
      return "🟥";
    }

    return "🟨";
  }

  if(
    t.includes("subst")
  ){
    return "🔄";
  }

  if(
    t.includes("var")
  ){
    return "📺";
  }

  return "•";
}


function trEventDetail(value){

  const text =
    String(value || "");

  const map = {
    "Normal Goal":
      "Gol",

    "Penalty":
      "Penaltı",

    "Missed Penalty":
      "Kaçan Penaltı",

    "Yellow Card":
      "Sarı Kart",

    "Red Card":
      "Kırmızı Kart",

    "Second Yellow card":
      "İkinci Sarıdan Kırmızı",

    "Substitution 1":
      "Oyuncu Değişikliği",

    "Substitution 2":
      "Oyuncu Değişikliği",

    "Substitution 3":
      "Oyuncu Değişikliği",

    "Goal cancelled":
      "Gol İptal",

    "Penalty confirmed":
      "Penaltı Onaylandı"
  };

  return map[text] || text;
}


function statRow(
  name,
  home,
  away
){

  if(
    (
      home === null ||
      home === undefined
    ) &&
    (
      away === null ||
      away === undefined
    )
  ){
    return "";
  }

  return `
    <div class="stat-row">

      <div class="stat-home">
        ${showValue(home)}
      </div>

      <div class="stat-name">
        ${esc(name)}
      </div>

      <div class="stat-away">
        ${showValue(away)}
      </div>

    </div>
  `;
}

function renderDebug(data){

  const statisticsError =
    data.debug
      ?.statisticsError;

  const eventsError =
    data.debug
      ?.eventsError;

  if(
    !statisticsError &&
    !eventsError
  ){
    return "";
  }

  let html =
    `
    <div class="debug-box">
      <b>Veri Durumu</b><br>
    `;

  if(
    statisticsError
  ){
    html += `
      İstatistik isteği:
      ${esc(statisticsError.message || "başarısız")}
      ${
        statisticsError.status
          ? ` (${esc(statisticsError.status)})`
          : ""
      }
      <br>
    `;
  }

  if(
    eventsError
  ){
    html += `
      Olaylar isteği:
      ${esc(eventsError.message || "başarısız")}
      ${
        eventsError.status
          ? ` (${esc(eventsError.status)})`
          : ""
      }
    `;
  }

  html +=
    `</div>`;

  return html;
}

    document.getElementById(
      "liveContent"
    );

  const refreshButton =
    document.getElementById(
      "refreshLiveBtn"
    );

  refreshButton.disabled =
    true;

  refreshButton.textContent =
    "Yükleniyor...";

  try{

    const response =
      await fetch(
        `/api/live-detail?fixture=${fixture}&t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      const message =
        data.error ||
        "Maç detayı alınamadı.";

      const apiError =
        data.errors &&
        Object.keys(
          data.errors
        ).length

          ? JSON.stringify(
              data.errors
            )

          : "";

      throw new Error(
        apiError
          ? `${message} ${apiError}`
          : message
      );
    }

    renderLiveDetail(
      data
    );

  }catch(e){

    root.innerHTML =
      `
      <div class="error">

        <b>
          Maç detayı alınamadı.
        </b>

        <br><br>

        ${esc(
          e.message ||
          "Bilinmeyen hata"
        )}

        <br><br>

        Yukarıdaki
        <b>Yenile</b>
        butonuna tekrar basabilirsin.

      </div>
      `;

  }finally{

    refreshButton.disabled =
      false;

    refreshButton.textContent =
      "↻ Yenile";
  }
}


function openLiveDetail(
  fixture
){

  activeLiveFixture =
    fixture;

  document
    .getElementById(
      "matchModal"
    )
    .classList.add(
      "show"
    );

  document.body.style.overflow =
    "hidden";

  document
    .getElementById(
      "liveContent"
    )
    .innerHTML =
      `
      <div class="loading">
        Maç detayları yükleniyor...
      </div>
      `;

  fetchLiveDetail(
    fixture
  );
}


function refreshLiveDetail(){

  if(
    !activeLiveFixture
  ){
    return;
  }

  fetchLiveDetail(
    activeLiveFixture
  );
}


function closeLiveDetail(){

  document
    .getElementById(
      "matchModal"
    )
    .classList.remove(
      "show"
    );

  document.body.style.overflow =
    "";

  activeLiveFixture =
    null;
}


document
  .getElementById(
    "matchModal"
  )
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "matchModal"
      ){
        closeLiveDetail();
      }
    }
  );


document
  .querySelectorAll(
    ".bar button"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          document
            .querySelectorAll(
              ".bar button"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          activeFilter =
            button.dataset.filter;

          render();
        };
    }
  );


const navButtons =
  document.querySelectorAll(
    ".nav button"
  );


function setNavActive(index){

  navButtons.forEach(
    button =>
      button.classList.remove(
        "active"
      )
  );

  navButtons[index]
    .classList.add(
      "active"
    );
}


navButtons[0].onclick =
  () => {

    setNavActive(0);

    document
      .querySelector(".bar")
      .style.display =
        "flex";

    activeFilter =
      "all";

    render();
  };


navButtons[1].onclick =
  () => {

    setNavActive(1);

    document
      .querySelector(".bar")
      .style.display =
        "flex";

    render();
  };


navButtons[2].onclick =
  () => {

    setNavActive(2);

    document
      .querySelector(".bar")
      .style.display =
        "none";

    renderStrongPicks();
  };


navButtons[3].onclick =
  () => {

    setNavActive(3);

    document
      .querySelector(".bar")
      .style.display =
        "none";

    showPlaceholder(
      "Favoriler",
      "Favorilere maç ekleme özelliğini sonraki geliştirmede aktif edeceğiz."
    );
  };


(async()=>{

  const root =
    document.getElementById(
      "list"
    );

  root.innerHTML =
    `
    <div class="loading">
      Gerçek maç verileri yükleniyor...
    </div>
    `;

  try{

    const response =
      await fetch(
        `/api/fixtures?t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !data.success
    ){
      throw new Error(
        data.error ||
        "Maç verisi alınamadı."
      );
    }

    matches =
      data.matches || [];

    render();

  }catch(e){

    document
      .getElementById("count")
      .textContent =
        "hata";

    root.innerHTML =
      `
      <div class="error">
        Maç verileri yüklenemedi.
        <br><br>
        ${esc(e.message || "")}
      </div>
      `;
  }

})();

</script>
