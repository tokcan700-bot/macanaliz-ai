<main class="app">

<script>
let matches = [];
let activeFilter = "all";
let currentView = "home";

const fmtTime = iso =>
  new Intl.DateTimeFormat("tr-TR", {
    timeZone: "Europe/Istanbul",
    hour: "2-digit",
    minute: "2-digit"
  }).format(new Date(iso));

const group = s =>
  ["1H","HT","2H","ET","BT","P","LIVE","INT"].includes(s)
    ? "LIVE"
    : s;

function todayKey(){
  return new Intl.DateTimeFormat("en-CA",{
    timeZone:"Europe/Istanbul",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).format(new Date());
}

function trAdvice(text){
  if(!text) return "API Tahmini";

  return text
    .replace(
      /^Combo Double chance\s*:\s*/i,
      "Kombine Tahmin: "
    )
    .replace(
      /^Double chance\s*:\s*/i,
      "Çifte Şans: "
    )
    .replace(
      /\bor draw\b/gi,
      "veya Beraberlik"
    )
    .replace(
      /\band\s*\+1\.5 goals\b/gi,
      " + 1.5 Üst"
    )
    .replace(
      /\band\s*\+2\.5 goals\b/gi,
      " + 2.5 Üst"
    )
    .replace(
      /\band\s*-1\.5 goals\b/gi,
      " + 1.5 Alt"
    )
    .replace(
      /\band\s*-2\.5 goals\b/gi,
      " + 2.5 Alt"
    )
    .replace(
      /\bhome\b/gi,
      "Ev Sahibi"
    )
    .replace(
      /\baway\b/gi,
      "Deplasman"
    )
    .replace(
      /\bdraw\b/gi,
      "Beraberlik"
    )
    .replace(
      /\bor\b/gi,
      "veya"
    )
    .replace(
      /\band\b/gi,
      "+"
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();
}

function strongStorageKey(){
  return "macanaliz-strong-" + todayKey();
}

function getStrongPicks(){
  try{
    return JSON.parse(
      localStorage.getItem(strongStorageKey()) || "[]"
    );
  }catch(e){
    return [];
  }
}

function saveStrongPick(match, prediction, model){
  if(!match || !model) return;

  const strong =
    model.over15 >= 80 ||
    model.over25 >= 70 ||
    model.btts >= 70;

  if(!strong) return;

  const picks = getStrongPicks();

  const item = {
    id: match.id,
    kickoff: match.kickoff,

    league: {
      name: match.league?.name || "",
      country: match.league?.country || "",
      logo: match.league?.logo || ""
    },

    home: {
      name: match.home?.name || "",
      logo: match.home?.logo || ""
    },

    away: {
      name: match.away?.name || "",
      logo: match.away?.logo || ""
    },

    advice: trAdvice(prediction?.advice),

    model: {
      over15: model.over15,
      over25: model.over25,
      btts: model.btts,

      confidence: model.confidence,

      expectedGoals: model.expectedGoals
    }
  };

  const oldIndex =
    picks.findIndex(x => x.id === match.id);

  if(oldIndex >= 0){
    picks[oldIndex] = item;
  }else{
    picks.push(item);
  }

  picks.sort((a,b)=>{
    const aBest = Math.max(
      a.model.over15,
      a.model.over25,
      a.model.btts
    );

    const bBest = Math.max(
      b.model.over15,
      b.model.over25,
      b.model.btts
    );

    return bBest - aBest;
  });

  localStorage.setItem(
    strongStorageKey(),
    JSON.stringify(picks)
  );
}

function render(){
  currentView = "home";

  const root =
    document.getElementById("list");

  const title =
    document.querySelector(".section-title h2");

  title.textContent =
    "Bugünün Maçları";

  const filtered =
    matches.filter(
      m =>
        activeFilter === "all" ||
        group(m.status) === activeFilter
    );

  document.getElementById("count")
    .textContent =
      filtered.length + " maç";

  if(!filtered.length){
    root.innerHTML =
      '<div class="empty">Bu filtrede maç bulunamadı.</div>';

    return;
  }

  root.innerHTML =
    filtered.map(m => `
      <article class="card">

        <div class="meta">

          <div class="league">

            ${
              m.league?.logo
                ? `<img src="${m.league.logo}" alt="">`
                : ""
            }

            <span>
              ${m.league?.country || ""}
              ·
              ${m.league?.name || ""}
            </span>

          </div>

          <span>
            ${fmtTime(m.kickoff)}
          </span>

        </div>

        <div class="teams">

          <div class="team">
            <img
              src="${m.home?.logo || ""}"
              alt=""
            >
            ${m.home?.name || ""}
          </div>

          <div class="score">
            ${
              m.status === "NS"
                ? "VS"
                : `${m.score?.home ?? "-"} - ${m.score?.away ?? "-"}`
            }
          </div>

          <div class="team">
            <img
              src="${m.away?.logo || ""}"
              alt=""
            >
            ${m.away?.name || ""}
          </div>

        </div>

        <div class="actions">

          <div class="status">
            Durum: ${m.status}
          </div>

          ${
            m.status === "NS"
              ? `
                <button
                  class="pred-btn"
                  onclick="loadPrediction(${m.id},this)"
                >
                  Analizi Gör
                </button>
              `
              : ""
          }

        </div>

        <div
          class="pred"
          id="pred-${m.id}"
        ></div>

      </article>
    `).join("");
}

function strongBadges(model){
  let html = "";

  if(model.over15 >= 80){
    html += `
      <div class="model-card">
        1.5 Üst
        <strong>${model.over15}%</strong>
        <span class="conf">
          ${model.confidence?.over15 || ""}
        </span>
      </div>
    `;
  }

  if(model.over25 >= 70){
    html += `
      <div class="model-card">
        2.5 Üst
        <strong>${model.over25}%</strong>
        <span class="conf">
          ${model.confidence?.over25 || ""}
        </span>
      </div>
    `;
  }

  if(model.btts >= 70){
    html += `
      <div class="model-card">
        KG Var
        <strong>${model.btts}%</strong>
        <span class="conf">
          ${model.confidence?.btts || ""}
        </span>
      </div>
    `;
  }

  return html;
}

function renderStrongPicks(){
  currentView = "predictions";

  const root =
    document.getElementById("list");

  const title =
    document.querySelector(".section-title h2");

  title.textContent =
    "En Güçlü Tahminler";

  const picks =
    getStrongPicks();

  document.getElementById("count")
    .textContent =
      picks.length + " maç";

  if(!picks.length){
    root.innerHTML = `
      <div class="empty">
        Henüz güçlü tahmin bulunmadı.
        <br><br>
        Bugünün maçlarında
        <b>Analizi Gör</b>
        butonuna bastıkça güçlü çıkan
        tahminler burada otomatik toplanacak.
      </div>
    `;

    return;
  }

  root.innerHTML =
    picks.map(p => `
      <article class="card">

        <div class="meta">

          <div class="league">

            ${
              p.league?.logo
                ? `<img src="${p.league.logo}" alt="">`
                : ""
            }

            <span>
              ${p.league?.country || ""}
              ·
              ${p.league?.name || ""}
            </span>

          </div>

          <span>
            ${fmtTime(p.kickoff)}
          </span>

        </div>

        <div class="teams">

          <div class="team">
            <img
              src="${p.home?.logo || ""}"
              alt=""
            >
            ${p.home?.name || ""}
          </div>

          <div class="score">
            VS
          </div>

          <div class="team">
            <img
              src="${p.away?.logo || ""}"
              alt=""
            >
            ${p.away?.name || ""}
          </div>

        </div>

        <div class="pred show">

          <div class="pred-title">
            ${p.advice}
          </div>

          <div class="model">

            <h4>
              Güçlü Model Tahminleri
            </h4>

            <div class="model-grid">
              ${strongBadges(p.model)}
            </div>

            <div class="note">
              Model Gol Beklentisi:
              Ev ${p.model.expectedGoals?.home ?? "-"}
              -
              Deplasman ${p.model.expectedGoals?.away ?? "-"}
              <br>

              Toplam:
              ${p.model.expectedGoals?.total ?? "-"}
            </div>

          </div>

        </div>

      </article>
    `).join("");
}
  function strongestModelPick(m){
  const picks = [
    {name:"1.5 Üst", value:m.over15},
    {name:"2.5 Üst", value:m.over25},
    {name:"KG Var", value:m.btts}
  ];

  picks.sort((a,b)=>b.value-a.value);

  return picks[0];
}

function sourceAgreement(p,m){
  const advice =
    String(p?.advice || "").toLowerCase();

  let agrees = 0;
  let checks = 0;

  if(
    advice.includes("+1.5") ||
    advice.includes("over 1.5")
  ){
    checks++;

    if(m.over15 >= 65){
      agrees++;
    }
  }

  if(
    advice.includes("+2.5") ||
    advice.includes("over 2.5")
  ){
    checks++;

    if(m.over25 >= 60){
      agrees++;
    }
  }

  if(checks === 0){
    return "Tarafsız";
  }

  if(agrees === checks){
    return "Yüksek Uyum";
  }

  if(agrees > 0){
    return "Kısmi Uyum";
  }

  return "Düşük Uyum";
}
function strongestModelPick(m){
  const picks = [
    {name:"1.5 Üst", value:m.over15},
    {name:"2.5 Üst", value:m.over25},
    {name:"KG Var", value:m.btts}
  ];

  picks.sort((a,b)=>b.value-a.value);

  return picks[0];
}

function sourceAgreement(p,m){
  const advice =
    String(p?.advice || "").toLowerCase();

  let agrees = 0;
  let checks = 0;

  if(
    advice.includes("+1.5") ||
    advice.includes("over 1.5")
  ){
    checks++;
    if(m.over15 >= 65) agrees++;
  }

  if(
    advice.includes("+2.5") ||
    advice.includes("over 2.5")
  ){
    checks++;
    if(m.over25 >= 60) agrees++;
  }

  if(checks === 0){
    return "Tarafsız";
  }

  if(agrees === checks){
    return "Yüksek Uyum";
  }

  if(agrees > 0){
    return "Kısmi Uyum";
  }

  return "Düşük Uyum";
}
async function loadPrediction(fixture,btn){
  const box =
    document.getElementById(
      "pred-" + fixture
    );

  box.classList.add("show");

  box.textContent =
    "Analiz hazırlanıyor...";

  btn.disabled = true;

  try{
    const r =
      await fetch(
        `/api/prediction?fixture=${fixture}`
      );

    const d =
      await r.json();

    if(!d.success){
      throw new Error();
    }

    const p =
      d.prediction;

    const m =
      d.model;
const strongest =
  strongestModelPick(m);

const agreement =
  sourceAgreement(p,m);

const dataQuality =
  m.dataCount >= 7
    ? "Yüksek"
    : m.dataCount >= 4
      ? "Orta"
      : "Düşük";
    let html = `
      <div class="pred-title">
        ${trAdvice(p.advice)}
      </div>

      <div class="pred-grid">

        <div class="pill">
          Ev Sahibi
          <b>
            ${p.percent.home || "-"}
          </b>
        </div>

        <div class="pill">
          Beraberlik
          <b>
            ${p.percent.draw || "-"}
          </b>
        </div>

        <div class="pill">
          Deplasman
          <b>
            ${p.percent.away || "-"}
          </b>
        </div>

      </div>
    `;

   if(m){
  html += `
    <div class="model">

      <h4>
        MaçAnaliz AI Detaylı Analiz
      </h4>

      <div class="model-grid">

        <div class="model-card">
          1.5 Üst
          <strong>${m.over15}%</strong>
          <span class="conf">
            ${m.confidence.over15}
          </span>
        </div>

        <div class="model-card">
          2.5 Üst
          <strong>${m.over25}%</strong>
          <span class="conf">
            ${m.confidence.over25}
          </span>
        </div>

        <div class="model-card">
          KG Var
          <strong>${m.btts}%</strong>
          <span class="conf">
            ${m.confidence.btts}
          </span>
        </div>

      </div>

      <div class="consensus-box">

        <div class="consensus-title">
          En Güçlü Model Sinyali
        </div>

        <div class="consensus-value">
          ${strongest.name} · ${strongest.value}%
        </div>

        <div class="consensus-sub">
          API tahmini ile model uyumu:
          ${agreement}
        </div>

      </div>

      <div class="analysis-details">

        <div class="analysis-row">
          <span>Model Gol Beklentisi</span>
          <b>
            ${m.expectedGoals.home}
            -
            ${m.expectedGoals.away}
          </b>
        </div>

        <div class="analysis-row">
          <span>Toplam Gol Beklentisi</span>
          <b>
            ${m.expectedGoals.total}
          </b>
        </div>

        <div class="analysis-row">
          <span>Veri Kalitesi</span>
          <b>
            ${dataQuality}
          </b>
        </div>

        <div class="analysis-row">
          <span>Kullanılan Veri Alanı</span>
          <b>
            ${m.dataCount}/8
          </b>
        </div>

        <div class="analysis-row">
          <span>API Görüşü</span>
          <b>
            ${trAdvice(p.advice)}
          </b>
        </div>

        <div class="analysis-row">
          <span>Hesaplama</span>
          <b>
            Poisson + form + lig verisi
          </b>
        </div>

      </div>

      <div class="source-badges">

        <span class="source-badge active">
          ✓ API-Football
        </span>

        <span class="source-badge active">
          ✓ MaçAnaliz Model
        </span>

        <span class="source-badge">
          Sportmonks · Yakında
        </span>

        <span class="source-badge">
          Dış Uzman Konsensüsü · Yakında
        </span>

      </div>

      <div class="note">
        Aktif hesaplama şu anda API-Football verisi
        ve MaçAnaliz Poisson modelini kullanır.
        Henüz bağlanmamış dış kaynaklar sonuç
        hesabına dahil edilmez.
      </div>

    </div>
  `;
}

const navButtons =
  document.querySelectorAll(
    ".nav button"
  );

navButtons.forEach(
  btn =>
    btn.classList.remove("active")
);

navButtons[0]
  .classList.add("active");

navButtons[0].onclick = () => {

  navButtons.forEach(
    x => x.classList.remove("active")
  );

  navButtons[0]
    .classList.add("active");

  document.querySelector(".bar")
    .style.display = "flex";

  render();
};

    .classList.add("active");

  document.querySelector(".bar")

navButtons[2].onclick = () => {

  navButtons.forEach(
    x => x.classList.remove("active")
  );

  navButtons[2]
    .classList.add("active");

  document.querySelector(".bar")
    .style.display = "none";

  renderStrongPicks();
};

(async()=>{

  const root =
    document.getElementById("list");

  root.innerHTML =
    '<div class="loading">Gerçek maç verileri yükleniyor...</div>';

  try{

    const r =
      await fetch(
        "/api/fixtures",
        {cache:"no-store"}
      );

    const d =
      await r.json();

    if(!d.success){
      throw new Error();
    }

    matches =
      d.matches || [];

    render();

  }catch(e){

    document
      .getElementById("count")
      .textContent =
        "hata";

    root.innerHTML =
      '<div class="error">Maç verileri yüklenemedi.</div>';
  }

})();
</script>
