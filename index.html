<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MaçAnaliz AI</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2c;--text:#f5f7fb;--muted:#91a2b7;--green:#19e58c;--line:#20334b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#091626);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;background:rgba(7,17,31,.95);border-bottom:1px solid var(--line);padding:15px 16px;z-index:5}
.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.logo b{color:var(--green)}.live{font-size:11px;border:1px solid #31506e;padding:5px 8px;border-radius:999px;color:#b8c6d6}
.hero{padding:24px 16px 14px}.hero h1{font-size:30px;line-height:1.08;margin:0 0 10px}.hero h1 span{color:var(--green)}.hero p{margin:0;color:var(--muted)}
.bar{display:flex;gap:8px;padding:0 16px 14px;overflow:auto}.bar button{background:var(--panel);color:#c8d4e0;border:1px solid var(--line);padding:10px 14px;border-radius:999px;white-space:nowrap;font-weight:700}.bar button.active{background:var(--green);color:#06150e}
.section{padding:0 16px}.section-title{display:flex;justify-content:space-between;margin:8px 0 12px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--muted)}
.card{background:linear-gradient(145deg,var(--panel),#0b1726);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:8px}.league{display:flex;align-items:center;gap:8px;min-width:0}.league img{width:18px;height:18px;object-fit:contain}.league span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams{display:grid;grid-template-columns:1fr 56px 1fr;gap:10px;align-items:center;margin:16px 0}.team{text-align:center;font-weight:800;font-size:14px}.team img{width:46px;height:46px;object-fit:contain;display:block;margin:0 auto 7px}.score{text-align:center;font-size:18px;font-weight:900}.status{display:inline-block;padding:7px 9px;border-radius:10px;background:#13283d;color:#cbd6e1;font-size:12px}
.loading,.error,.empty{margin:20px 0;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(7,17,31,.97);border-top:1px solid var(--line);padding:9px 10px}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;color:#7f91a7;font-size:11px}.nav button span{display:block;font-size:20px}.nav button.active{color:var(--green)}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">⚽ MaçAnaliz <b>AI</b></div><div class="live">CANLI VERİ</div></div></header>
<section class="hero"><h1>Bugünün <span>gerçek maçları</span></h1><p>Veriler MaçAnaliz API üzerinden yükleniyor.</p></section>
<div class="bar"><button class="active" data-filter="all">Tümü</button><button data-filter="NS">Başlamadı</button><button data-filter="LIVE">Canlı</button><button data-filter="FT">Biten</button></div>
<section class="section"><div class="section-title"><h2>Bugünün Maçları</h2><small id="count">yükleniyor...</small></div><div id="list"></div></section>
</main>
<nav class="bottom"><div class="nav"><button class="active"><span>⌂</span>Ana Sayfa</button><button><span>⚽</span>Maçlar</button><button><span>▥</span>Tahminler</button><button><span>☆</span>Favoriler</button></div></nav>
<script>
const API="https://macanaliz-api.tokcan700.workers.dev";
let matches=[],activeFilter="all";
const fmtTime=iso=>new Intl.DateTimeFormat("tr-TR",{timeZone:"Europe/Istanbul",hour:"2-digit",minute:"2-digit"}).format(new Date(iso));
const group=s=>["1H","HT","2H","ET","BT","P","LIVE","INT"].includes(s)?"LIVE":s;
function render(){
 const root=document.getElementById("list");
 const filtered=matches.filter(m=>activeFilter==="all"||group(m.status)===activeFilter);
 document.getElementById("count").textContent=filtered.length+" maç";
 if(!filtered.length){root.innerHTML='<div class="empty">Bu filtrede maç bulunamadı.</div>';return;}
 root.innerHTML=filtered.map(m=>`<article class="card">
 <div class="meta"><div class="league">${m.league?.logo?`<img src="${m.league.logo}" alt="">`:""}<span>${m.league?.country||""} · ${m.league?.name||""}</span></div><span>${fmtTime(m.kickoff)}</span></div>
 <div class="teams"><div class="team"><img src="${m.home?.logo||""}" alt="">${m.home?.name||""}</div><div class="score">${m.status==="NS"?"VS":`${m.score?.home ?? "-"} - ${m.score?.away ?? "-"}`}</div><div class="team"><img src="${m.away?.logo||""}" alt="">${m.away?.name||""}</div></div>
 <div class="status">Durum: ${m.status}</div></article>`).join("");
}
document.querySelectorAll(".bar button").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".bar button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");activeFilter=btn.dataset.filter;render();});
(async()=>{const root=document.getElementById("list");root.innerHTML='<div class="loading">Gerçek maç verileri yükleniyor...</div>';try{const r=await fetch(API,{cache:"no-store"});const data=await r.json();if(!data.success)throw new Error();matches=data.matches||[];render();}catch(e){document.getElementById("count").textContent="hata";root.innerHTML='<div class="error">Maç verileri yüklenemedi.</div>';}})();
</script>
</body>
</html>
